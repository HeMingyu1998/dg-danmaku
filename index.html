<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta http-equiv="content-language" content="zh-CN">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">

    <!-- 必须：允许屏蔽 Referrer，否则拉取B站头像/表情会被腾讯云图库拦截 -->
    <meta content="never" name="referrer">

    <title>点怪弹幕插件 - PlayWithMe.js</title>

    <!-- https://github.com/h2non/jshashes -->
    <script src="./Lib/h2non/jshashes.min.js" type="text/javascript"></script>
    <!-- https://github.com/XL7Z/BiliBili_PlayWithMe.js -->
    <script src="./Lib/PlayWithMe.js/BiLive_PlayWithMe.js" type="text/javascript"></script>
    <!-- 本地自签用的开发者密钥。发布时请删除本行与本文件 -->

    <style>
        /* ================= 透明底，方便直接当OBS浏览器源叠加 ================= */
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
        }

        /* 调试时可把 background 改成 #0008 看看区域范围 */
        /* 100% 而不是 100vw：显示页的尺寸由直播姬 iframe 决定，
           用 % 才能正确跟随父级容器，也不会被滚动条宽度影响 */
        #DG_Root {
            width: 100%;
            height: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        /* ================= 设置页（plug_env=1） ================= */
        /* 设置页在直播姬的设置面板里打开，是白底UI，所以这里用深色文字 */
        /* 默认隐藏，由JS按运行模式决定显示哪一个，避免页面加载时闪现 */
        #DG_Settings {
            display: none;
            width: 100%;
            min-height: 100%;
            box-sizing: border-box;
            padding: 20px;
            background: #FFFFFF;
            color: #333333;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: auto;
        }

        #DG_Settings h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #222222;
        }

        #DG_Settings .DG_Row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #DG_Settings label {
            min-width: 84px;
            color: #555555;
        }

        #DG_Settings input[type="number"] {
            width: 96px;
            height: 32px;
            box-sizing: border-box;
            padding: 0 8px;
            font-size: 14px;
            color: #333333;
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 6px;
            outline: none;
        }

        #DG_Settings input[type="number"]:focus {
            border-color: #FF6699;
        }

        #DG_Settings button {
            height: 32px;
            padding: 0 16px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #D9D9D9;
            background: #FFFFFF;
            color: #333333;
            cursor: pointer;
        }

        #DG_Settings button:hover {
            border-color: #FF6699;
            color: #FF6699;
        }

        #DG_Settings button.DG_Primary {
            background: #FF6699;
            border-color: #FF6699;
            color: #FFFFFF;
        }

        #DG_Settings button.DG_Primary:hover {
            background: #E85A8A;
            border-color: #E85A8A;
            color: #FFFFFF;
        }

        /* 预览区：按比例缩小展示显示区的形状 */
        #DG_PreviewWrap {
            height: 200px;
            box-sizing: border-box;
            padding: 8px;
            border: 1px dashed #D9D9D9;
            border-radius: 8px;
            background: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #DG_Preview {
            /* 棋盘格背景，一眼能看出"透明"/"非透明" */
            background-color: #FFFFFF;
            background-image:
                linear-gradient(45deg, #E8E8E8 25%, transparent 25%, transparent 75%, #E8E8E8 75%),
                linear-gradient(45deg, #E8E8E8 25%, transparent 25%, transparent 75%, #E8E8E8 75%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            border: 1px solid #BBBBBB;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888888;
            font-size: 12px;
        }

        #DG_Status {
            min-height: 20px;
            font-size: 13px;
            color: #22AA66;
        }

        #DG_Status.DG_Err {
            color: #E23C3C;
        }

        /* 探针结果：等宽字体，方便整体复制 */
        #DG_Probe {
            margin: 0;
            padding: 10px;
            background: #F5F5F5;
            border: 1px solid #E3E3E3;
            border-radius: 6px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #444444;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .DG_Hint {
            font-size: 12px;
            color: #999999;
            line-height: 1.6;
        }

        /* ================= 顶部堆叠区：只放“点怪”开头的SC ================= */
        /* 新SC插到最前面，于是最新的永远在最上面 */
        #DG_SCZone {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ================= 下方滚动区：普通“点怪”弹幕逐行 ================= */
        #DG_DmZone {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .DG_Line {
            display: flex;
            align-items: baseline;
            gap: .5em;
            line-height: 1.45;
            font-size: 22px;
            color: #FFFFFF;

            /* SC 与普通弹幕外观完全一致，只有文本颜色不同。
               统一加一层半透明黑底：纯红纯绿文字直接压在任意画面上，
               遇到亮背景会糊成一片，垫个底才保证两种颜色都读得清 */
            background: rgba(0, 0, 0, .35);
            border-radius: 6px;
            padding: 2px 8px;

            /* 保证在任何画面上都看得清（OBS必备） */
            text-shadow:
                0 0 2px #000,
                0 0 4px #000,
                1px 1px 0 #000,
                -1px 1px 0 #000,
                1px -1px 0 #000,
                -1px -1px 0 #000;

            /* 长文本自动折行，不撑破OBS窗口 */
            word-break: break-word;
            overflow-wrap: anywhere;
            animation: DG_In .18s ease-out;
        }

        /* 高亮闪烁一下，方便主播一眼看到新的一条 */
        @keyframes DG_In {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* 被撤掉的SC做一个淡出，然后由JS移除 */
        .DG_Removing {
            animation: DG_Out .3s ease-in forwards;
        }

        @keyframes DG_Out {
            to {
                opacity: 0;
                transform: translateX(16px);
            }
        }

        /* ================= 每行的关闭按钮 ================= */
        /* 平常完全隐藏、不占位；鼠标移到这一行上才出现 */
        /* 给右侧预留位置，避免按钮浮在文字上面 */
        .DG_Line {
            position: relative;
            padding-right: 26px;
        }

        .DG_Close {
            position: absolute;
            right: 2px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            line-height: 18px;
            text-align: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .55);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            /* 关键：默认不可见也不吃鼠标事件，免得它在行尾挡住别的东西 */
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            /* 别被上面的 text-shadow 影响 */
            text-shadow: none;
            user-select: none;
        }

        /* 悬停整行时按钮才出现，并恢复可点击 */
        .DG_Line:hover .DG_Close {
            opacity: 1;
            pointer-events: auto;
        }

        .DG_Close:hover {
            background: #FF4D6A;
            border-color: #FFFFFF;
        }

        /* 用户昵称：SC 和普通弹幕都是白色 */
        .DG_User {
            flex: 0 0 auto;
            color: #FFFFFF;
            font-weight: 700;
            font-size: .82em;
            letter-spacing: .02em;
        }

        /* 分隔符 */
        .DG_Sep {
            flex: 0 0 auto;
            opacity: .55;
        }

        /* 消息正文 */
        /* 默认绿色 = 普通弹幕；SC 由下面的 .DG_SC .DG_Text 覆盖成红色 */
        .DG_Text {
            flex: 0 1 auto;
            min-width: 0;
            color: #4CE86B;
        }

        /* ================= SC 行 ================= */
        /* 外观与普通弹幕完全一致，唯一区别就是文本颜色 */
        .DG_SC .DG_Text {
            color: #FF5C5C;
        }

        /* 设置页提示（plug_env=1 且还没开播时用得上） */
        #DG_Tip {
            font-size: 15px;
            color: #FFF;
            text-shadow: 0 0 3px #000, 1px 1px 0 #000;
            opacity: .85;
        }

        /* ================= 显示页右上角的设置入口 ================= */
        /* 刻意做得很低调：默认几乎透明，鼠标移上去才明显，不干扰直播画面 */
        #DG_SettingEntry {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 9999;
            display: block;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .45);
            color: #FFF;
            font-size: 13px;
            line-height: 1.6;
            text-decoration: none;
            opacity: .18;
            transition: opacity .2s;
            cursor: pointer;
        }

        #DG_SettingEntry:hover {
            opacity: 1;
            background: #FF6699;
        }
    </style>
</head>

<body>

    <!-- ============ 显示页（plug_env=0）：正常渲染弹幕 ============ -->
    <div id="DG_Root">
        <!-- 顶部：点怪SC堆叠区，新的插在最上面 -->
        <div id="DG_SCZone"></div>
        <!-- 下方：点怪弹幕逐行显示区 -->
        <div id="DG_DmZone"></div>
        <div id="DG_Tip">等待主播身份码 / 等待“点怪”弹幕…</div>
    </div>

    <!-- 显示页右上角的设置入口：点它切到设置页 -->
    <!-- 用 <a> 而不是 button，这样中键/右键新标签打开也能用 -->
    <a id="DG_SettingEntry" href="?plug_env=1" title="打开插件设置">⚙ 设置</a>

    <!-- ============ 设置页（plug_env=1）：给主播填显示区宽高 ============ -->
    <div id="DG_Settings">
        <h3>点怪弹幕 · 插件设置</h3>

        <div class="DG_Row">
            <a id="DG_BackLink" href="?" style="color:#FF6699">← 返回显示页</a>
        </div>

        <div class="DG_Row">
            <label for="DG_W">显示区宽度</label>
            <input id="DG_W" type="number" min="1" max="4096" step="1">
            <span>px</span>
        </div>

        <div class="DG_Row">
            <label for="DG_H">显示区高度</label>
            <input id="DG_H" type="number" min="1" max="4096" step="1">
            <span>px</span>
        </div>

        <div class="DG_Row">
            <button id="DG_Save" class="DG_Primary">保存设置</button>
            <button id="DG_Reset">恢复默认</button>
        </div>

        <div id="DG_Status"></div>

        <div id="DG_PreviewWrap">
            <div id="DG_Preview">预览</div>
        </div>

        <div class="DG_Hint">
            宽高只用于预览与显示区自适应参考。实际画面尺寸由直播姬的插件窗口决定，
            建议让两者保持一致，以免文字被缩放导致发虚。
        </div>

        <!-- 环境探针：把当前页面的真实参数打印出来，方便反馈给开发者 -->
        <h3>环境探针</h3>
        <div class="DG_Row">
            <button id="DG_ProbeBtn">重新检测</button>
        </div>
        <pre id="DG_Probe"></pre>
    </div>

    <script>
        /* ============================================================================
         *  插件名：点怪弹幕 / 点怪SC 收集器
         *  依赖：BiliBili_PlayWithMe.js  (BiLive_PlayWithMe.Full.js)
         *
         *  规则：
         *   1) 普通弹幕 msg 以“点怪”开头  → 追加到底部列表，格式“用户ID - 弹幕文本”
         *   2) SC的 message 以“点怪”开头  → 插到顶部列表最前面（新的在最上面）
         *   3) SC被撤回（LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL）→ 自动移除对应那一行
         *
         *  字段说明（开平长链）：
         *   弹幕 LIVE_OPEN_PLATFORM_DM   : data.msg      / data.uid / data.uname
         *   SC   LIVE_OPEN_PLATFORM_SUPER_CHAT : data.message / data.message_id / data.rmb
         * ==========================================================================*/


        /* ---------------------------------------------------------------------------
         * 【运行模式】直播姬会把同一个HTML加载两次，靠URL参数 plug_env 区分
         *   plug_env=1 → 设置页，只给主播填参数，绝对不能连开平长链
         *   plug_env=0 → 显示页，正常收弹幕渲染
         *   取不到参数时按显示页处理，保证不影响正常出画面
         *
         * 本地调试：
         *   正常页      点怪弹幕插件.html
         *   设置页      点怪弹幕插件.html?plug_env=1
         *   强制设置页  点怪弹幕插件.html?DG_MODE=setting
         * -------------------------------------------------------------------------*/
        const DG_UrlParams = new URLSearchParams(window.location.search);
        const DG_PlugEnv = parseInt(DG_UrlParams.get("plug_env") || "0", 10);
        const DG_ForceMode = (DG_UrlParams.get("DG_MODE") || "").toLowerCase();
        const DG_IsSettingPage = DG_ForceMode === "setting" || DG_PlugEnv === 1;


        /* ---------------------------------------------------------------------------
         * 【配置区】按需要改这里就够了
         * -------------------------------------------------------------------------*/
        const DG_Config = {
            // 触发前缀，不区分前后空格（" 点怪 x  " 也能匹配）
            Prefix: "点怪",
            // 显示时是否保留“点怪”两个字
            //   true  → “12345 - 点怪 打个大怪”
            //   false → “12345 - 打个大怪”      （正文为空时仍会显示“点怪”）
            KeepPrefix: false,
            // 普通弹幕最多保留多少行，超出丢弃最旧的
            MaxDanmaku: 100,
            // SC最多保留多少行
            MaxSC: 20,
            // 同一秒内同一个人发的一模一样的内容，算重复，直接忽略
            // 弹幕重连时偶尔会重放，开平长链没有原生去重
            DuplicateWindowMs: 1000,
            // 消息正文里如果出现分号或竖线，是否拆成多行显示
            SplitMultiLine: false
        };


        /* ---------------------------------------------------------------------------
         * 【显示区尺寸】跨页共享
         * - 设置页与显示页是两个独立的JS上下文，变量传不过去
         * - 两者同源，所以用 localStorage 当桥梁
         * - key 带版本号，改默认值时升版本即可让旧值自动失效
         * -------------------------------------------------------------------------*/
        const DG_SizeKey = "DG_Size_V1";

        const DG_DefaultSize = { W: 480, H: 720 };

        // 允许范围，防止离谱数值破坏布局
        const DG_SizeMin = 1;
        const DG_SizeMax = 4096;

        /**
         * 把输入夹紧成合法整数
         * - 这个值最终会进入CSS，所以必须校验，否则等于开了注入口子
         */
        function DG_ClampSize(Value, Fallback) {
            const Num = Math.floor(Number(Value));
            if (!isFinite(Num)) return Fallback;
            return Math.min(DG_SizeMax, Math.max(DG_SizeMin, Num));
        }

        /**
         * 读取主播保存的尺寸
         * @returns {{W:number,H:number,From:string}} From 标记数据来源，便于排查
         */
        function DG_LoadSize() {
            // 1) 优先用URL参数：如果直播姬真的下发了尺寸，就不需要localStorage了
            const UrlW = DG_UrlParams.get("width") ?? DG_UrlParams.get("W");
            const UrlH = DG_UrlParams.get("height") ?? DG_UrlParams.get("H");
            if (UrlW !== null && UrlH !== null) {
                return {
                    W: DG_ClampSize(UrlW, DG_DefaultSize.W),
                    H: DG_ClampSize(UrlH, DG_DefaultSize.H),
                    From: "URL参数"
                };
            }

            // 2) 退回 localStorage
            try {
                const Raw = localStorage.getItem(DG_SizeKey);
                if (Raw) {
                    const Obj = JSON.parse(Raw);
                    return {
                        W: DG_ClampSize(Obj.W, DG_DefaultSize.W),
                        H: DG_ClampSize(Obj.H, DG_DefaultSize.H),
                        From: "localStorage"
                    };
                }
            } catch (E) {
                // 无痕模式或被策略禁用时会抛异常，忽略即可，用默认值继续
                console.warn("[点怪插件] 读取本地设置失败，使用默认值", E);
            }

            // 3) 都没有，用默认值
            return { W: DG_DefaultSize.W, H: DG_DefaultSize.H, From: "默认值" };
        }

        /**
         * 保存尺寸
         * @returns {boolean} 是否保存成功
         */
        function DG_SaveSize(W, H) {
            try {
                localStorage.setItem(DG_SizeKey, JSON.stringify({
                    W: DG_ClampSize(W, DG_DefaultSize.W),
                    H: DG_ClampSize(H, DG_DefaultSize.H)
                }));
                return true;
            } catch (E) {
                console.warn("[点怪插件] 保存本地设置失败", E);
                return false;
            }
        }

        /**
         * 清掉保存的尺寸，回到默认值
         */
        function DG_ClearSize() {
            try {
                localStorage.removeItem(DG_SizeKey);
                return true;
            } catch (E) {
                return false;
            }
        }


        /* ---------------------------------------------------------------------------
         * 【DOM】一次取好，别每次事件都查DOM
         * -------------------------------------------------------------------------*/
        const DG_Dom = {
            SCZone: document.getElementById("DG_SCZone"),
            DmZone: document.getElementById("DG_DmZone"),
            Tip: document.getElementById("DG_Tip"),
            Lines: new Map() // msg_id → 行元素，用于撤回时精准删除
        };

        // 普通弹幕是否发生了溢出，需要一个数组记住顺序
        const DG_DanmakuOrder = [];


        /* ---------------------------------------------------------------------------
         * 【模式分流】按运行模式决定显示哪一个界面
         * - 设置页：显示设置表单，隐藏显示区，且绝不启动开平长链
         * - 显示页：显示渲染区，隐藏设置表单
         * -------------------------------------------------------------------------*/
        function DG_ApplyPageMode() {
            const Root = document.getElementById("DG_Root");
            const Settings = document.getElementById("DG_Settings");
            const Entry = document.getElementById("DG_SettingEntry");

            if (DG_IsSettingPage) {
                if (Root) Root.style.display = "none";
                if (Entry) Entry.style.display = "none";  // 设置页不需要再指向自己
                if (Settings) Settings.style.display = "flex";
                DG_InitSettingsPage();
            } else {
                if (Settings) Settings.style.display = "none";
                if (Root) Root.style.display = "";
                if (Entry) Entry.style.display = "";

                // 保留原有参数（比如CODE），只把plug_env改成1
                // 这样带着身份码的链接点过去，设置页也能看到真实的参数情况
                if (Entry) {
                    const Kept = new URLSearchParams(window.location.search);
                    Kept.set("plug_env", "1");
                    Entry.href = "?" + Kept.toString();
                }

                // 启用关闭按钮的委托监听（只需挂一次，之后新加的行自动生效）
                DG_BindCloseDelegation();

                DG_LogProbe("显示页");
            }
        }


        /* ---------------------------------------------------------------------------
         * 【探针】把当前页面的真实环境参数打印出来
         * - 直播姬到底传了什么参数、iframe实际多大，只有实测才知道
         * - 同时输出到控制台和设置页，方便主播直接复制反馈
         * -------------------------------------------------------------------------*/
        function DG_CollectProbe() {
            const Lines = [];
            const W = window.innerWidth;
            const H = window.innerHeight;

            Lines.push("运行模式   : " + (DG_IsSettingPage ? "设置页 (plug_env=1)" : "显示页 (plug_env=0)"));
            Lines.push("plug_env   : " + (DG_UrlParams.get("plug_env") ?? "(未传)"));
            Lines.push("iframe尺寸 : " + W + " × " + H);
            Lines.push("页面地址   : " + window.location.href);
            Lines.push("本地已存宽高: " + JSON.stringify(DG_LoadSize()));
            Lines.push("");

            // 把全部URL参数列出来，这才是我们真正要找的东西
            const All = [...DG_UrlParams];
            if (All.length === 0) {
                Lines.push("URL参数    : (没有任何参数)");
            } else {
                Lines.push("URL参数    : 共 " + All.length + " 个");
                All.forEach(([K, V]) => {
                    // CODE之类的敏感参数不打印全文
                    const Shown = /code|sign|key|token/i.test(K)
                        ? V.slice(0, 3) + "***(已隐藏)"
                        : V;
                    Lines.push("   " + K + " = " + Shown);
                });
            }
            return Lines.join("\n");
        }

        function DG_LogProbe(Tag) {
            console.log("[点怪插件] [" + Tag + "] 环境探针\n" + DG_CollectProbe());
        }


        /* ---------------------------------------------------------------------------
         * 【设置页】初始化表单
         * -------------------------------------------------------------------------*/
        function DG_InitSettingsPage() {
            const IptW = document.getElementById("DG_W");
            const IptH = document.getElementById("DG_H");
            const BtnSave = document.getElementById("DG_Save");
            const BtnReset = document.getElementById("DG_Reset");
            const Box = document.getElementById("DG_Preview");
            const Wrap = document.getElementById("DG_PreviewWrap");
            const Status = document.getElementById("DG_Status");
            const BtnProbe = document.getElementById("DG_ProbeBtn");
            const ProbeOut = document.getElementById("DG_Probe");

            // 回填当前值
            const Now = DG_LoadSize();
            if (IptW) IptW.value = Now.W;
            if (IptH) IptH.value = Now.H;

            /**
             * 状态提示
             */
            function SetStatus(Text, IsError) {
                if (!Status) return;
                Status.textContent = Text;
                Status.className = IsError ? "DG_Err" : "";
            }

            /**
             * 显示当前生效值以及它的来源
             * - 来源很重要：能一眼看出是读了URL参数、本地存储，还是用了默认值
             * - 如果显示“默认值”而你以为存过了，说明localStorage没写进去
             */
            function ShowCurrent() {
                const Cur = DG_LoadSize();
                SetStatus("当前生效：" + Cur.W + " × " + Cur.H + "（来源：" + Cur.From + "）", false);
            }

            /**
             * 按输入的宽高重画预览方块
             * - 只做等比缩放，用来直观确认比例对不对
             */
            function Redraw() {
                if (!Box || !Wrap) return;

                const W = DG_ClampSize(IptW && IptW.value, DG_DefaultSize.W);
                const H = DG_ClampSize(IptH && IptH.value, DG_DefaultSize.H);

                // 留出边框和内边距的余量
                const AvailW = Math.max(20, Wrap.clientWidth - 20);
                const AvailH = Math.max(20, Wrap.clientHeight - 20);

                // 取较小的缩放比例，保证宽高都塞得下
                const Scale = Math.min(AvailW / W, AvailH / H, 1);

                Box.style.width = Math.max(16, Math.round(W * Scale)) + "px";
                Box.style.height = Math.max(16, Math.round(H * Scale)) + "px";
                Box.textContent = W + " × " + H;
            }

            // 输入时实时预览
            if (IptW) IptW.addEventListener("input", Redraw);
            if (IptH) IptH.addEventListener("input", Redraw);

            // 保存
            if (BtnSave) {
                BtnSave.addEventListener("click", () => {
                    const W = DG_ClampSize(IptW && IptW.value, DG_DefaultSize.W);
                    const H = DG_ClampSize(IptH && IptH.value, DG_DefaultSize.H);

                    // 夹紧后把实际生效的值写回输入框，避免显示值与存的值不一致
                    if (IptW) IptW.value = W;
                    if (IptH) IptH.value = H;

                    if (DG_SaveSize(W, H)) {
                        ShowCurrent();
                    } else {
                        SetStatus("保存失败：浏览器禁用了本地存储，设置无法持久化", true);
                    }
                    Redraw();
                });
            }

            // 恢复默认
            if (BtnReset) {
                BtnReset.addEventListener("click", () => {
                    DG_ClearSize();
                    if (IptW) IptW.value = DG_DefaultSize.W;
                    if (IptH) IptH.value = DG_DefaultSize.H;
                    ShowCurrent();
                    Redraw();
                });
            }

            // 重新检测探针
            if (BtnProbe) {
                BtnProbe.addEventListener("click", () => {
                    if (ProbeOut) ProbeOut.textContent = DG_CollectProbe();
                });
            }

            // 首次填充
            if (ProbeOut) ProbeOut.textContent = DG_CollectProbe();

            // “返回显示页”要保留其他参数（比如CODE），但必须去掉plug_env
            // 否则回去还是设置页，等于绕圈
            const Back = document.getElementById("DG_BackLink");
            if (Back) {
                const Kept = new URLSearchParams(window.location.search);
                Kept.delete("plug_env");
                const Qs = Kept.toString();
                Back.href = Qs ? "?" + Qs : window.location.pathname;
            }

            // 面板尺寸变化时重算预览（设置面板会被拉伸）
            if (window.ResizeObserver && Wrap) {
                new ResizeObserver(Redraw).observe(Wrap);
            } else {
                window.addEventListener("resize", Redraw);
            }

            Redraw();
            // 首次进来就把“当前生效值 + 来源”显示出来
            ShowCurrent();
            DG_LogProbe("设置页");
        }


        /* ---------------------------------------------------------------------------
         * 【工具】从文本里判断是否为“点怪”并取出要显示的正文
         * @param   {string} Text 弹幕的 msg 或 SC 的 message
         * @returns {null | {Text:string}} 命中返回对象，未命中返回 null
         * -------------------------------------------------------------------------*/
        function DG_Match(Text) {
            // 防脏数据：null / undefined / 非字符串直接踢掉
            if (typeof Text !== "string") return null;

            const Trimmed = Text.trim();

            // 注意：这里用 trim 后再判断，所以 “  点怪  xxx  ” 也能命中
            if (!Trimmed.startsWith(DG_Config.Prefix)) return null;

            // 正文 = 去掉前缀的部分
            const Body = Trimmed.slice(DG_Config.Prefix.length).trim();

            if (DG_Config.KeepPrefix) {
                // 原文可能是空的，trim后兜底显示前缀，避免出现空白行
                return { Text: Trimmed.length > 0 ? Trimmed : DG_Config.Prefix };
            }

            // 不保留前缀时，正文为空就至少显示个前缀，免得主播不知道是谁点了怪
            return { Text: Body.length > 0 ? Body : DG_Config.Prefix };
        }


        /* ---------------------------------------------------------------------------
         * 【工具】把 1 条文本拆成 多行（可选功能）
         * -------------------------------------------------------------------------*/
        function DG_SplitText(Text) {
            if (!DG_Config.SplitMultiLine) return [Text];

            return Text
                .split(/[;；|｜]/)
                .map(S => S.trim())
                .filter(S => S.length > 0);
        }


        /* ---------------------------------------------------------------------------
         * 【工具】重复消息过滤
         * -------------------------------------------------------------------------*/
        const DG_RecentKeys = new Map(); // Key → 时间戳

        function DG_IsDuplicate(Key) {
            const Now = Date.now();
            const Last = DG_RecentKeys.get(Key);

            // 顺手清理过期记录，防止Map无限长大
            if (DG_RecentKeys.size > 200) {
                DG_RecentKeys.forEach((T, K) => {
                    if (Now - T > DG_Config.DuplicateWindowMs * 10) DG_RecentKeys.delete(K);
                });
            }

            if (Last !== undefined && (Now - Last) < DG_Config.DuplicateWindowMs) return true;

            DG_RecentKeys.set(Key, Now);
            return false;
        }


        /* ---------------------------------------------------------------------------
         * 【工具】删除一行，并把它留下的所有内部记录清理干净
         *
         * 必须一起处理两处，否则会留下悬空引用：
         *   1. DG_Dom.Lines      —— msg_id → 行元素 的登记表（撤回功能靠它找行）
         *   2. DG_DanmakuOrder   —— 普通弹幕的淘汰顺序数组
         *
         * 第2点尤其容易漏：数组里留着已删除的DOM节点，会导致
         * "淘汰最旧一行"时误删一个早就不存在的元素，真正该淘汰的反而留下。
         *
         * @param {HTMLElement} Line 要删除的行
         * @param {boolean} Fade 是否先淡出再删除
         * -------------------------------------------------------------------------*/
        function DG_RemoveLine(Line, Fade) {
            if (!Line) return;

            // 1) 先在登记表里找到并删掉所有指向这一行的条目
            //    这里做全量扫描，而不是只看 Line.dataset.msgId：
            //    早期创建的行可能没有 dataset，靠扫描才清得干净
            DG_Dom.Lines.forEach((El, Key) => {
                if (El === Line) DG_Dom.Lines.delete(Key);
            });

            // 2) 从普通弹幕的顺序数组里摘掉
            const Idx = DG_DanmakuOrder.indexOf(Line);
            if (Idx !== -1) DG_DanmakuOrder.splice(Idx, 1);

            // 3) 从DOM移除
            if (Fade === false) {
                Line.remove();
            } else {
                // 复用SC撤回的淡出动画
                Line.classList.add("DG_Removing");
                setTimeout(() => Line.remove(), 300);
            }
        }


        /* ---------------------------------------------------------------------------
         * 【事件委托】处理关闭按钮的点击
         *
         * 用委托而不是给每个按钮单独 addEventListener：
         * 行是动态增删的，逐行绑事件既麻烦又容易漏掉解绑。
         * 委托只需在容器上挂一次，永远有效。
         * -------------------------------------------------------------------------*/
        function DG_BindCloseDelegation() {
            [DG_Dom.SCZone, DG_Dom.DmZone].forEach((Zone) => {
                if (!Zone) return;

                Zone.addEventListener("click", (Evt) => {
                    // closest 保证点到按钮内部的文字节点也能命中
                    const Btn = Evt.target.closest(".DG_Close");
                    if (!Btn) return;

                    // 按钮的父元素就是这一行
                    const Line = Btn.parentElement;
                    if (!Line) return;

                    // 阻止冒泡：万一以后行本身也要绑定点击行为
                    Evt.preventDefault();
                    Evt.stopPropagation();

                    DG_RemoveLine(Line, true);
                });
            });
        }


        /* ---------------------------------------------------------------------------
         * 【工具】给一行挂上"关闭"按钮
         * - 按钮本身不绑事件，统一由容器上的委托监听处理（见 DG_BindCloseDelegation）
         * - 这样行被删掉时不会留下孤立的事件监听，也不会造成内存泄漏
         * -------------------------------------------------------------------------*/
        function DG_AttachClose(Line) {
            const Btn = document.createElement("span");
            Btn.className = "DG_Close";
            Btn.textContent = "×";
            Btn.title = "删除这一行";
            // 标记一下，方便以后想改成"只允许删SC"之类的策略
            Btn.dataset.dgClose = "1";
            Line.appendChild(Btn);
        }


        /* ---------------------------------------------------------------------------
         * 【核心】生成一行：“用户ID - 文本”
         * @param {object}  Opt
         * @param {string}  Opt.uid    用户UID
         * @param {string}  Opt.uname  用户昵称（显示在行尾）
         * @param {string}  Opt.text   显示文本
         * @param {boolean} Opt.isSC   是否为SC行
         * @param {string}  Opt.msgID  消息ID，用于撤回
         * @returns {HTMLElement} 一行DOM
         * -------------------------------------------------------------------------*/
        function DG_BuildLine(Opt) {
            const Line = document.createElement("div");
            Line.className = "DG_Line" + (Opt.isSC ? " DG_SC" : "");
            if (Opt.msgID) Line.dataset.msgId = Opt.msgID;
            // 昵称额外存一份到dataset，方便以后做筛选/统计
            Line.dataset.uname = Opt.uname || "";

            // 正文（可能被拆成多段，这里用 <br> 串起来）
            const TextEl = document.createElement("span");
            TextEl.className = "DG_Text";
            DG_SplitText(Opt.text).forEach((Seg, Idx) => {
                if (Idx > 0) TextEl.appendChild(document.createElement("br"));
                TextEl.appendChild(document.createTextNode(Seg));
            });
            Line.appendChild(TextEl);

            // 分隔符
            const SepEl = document.createElement("span");
            SepEl.className = "DG_Sep";
            SepEl.textContent = "-";
            Line.appendChild(SepEl);

            // 用户昵称
            const UserEl = document.createElement("span");
            UserEl.className = "DG_User";
            UserEl.textContent = String(Opt.uname);
            Line.appendChild(UserEl);

            // 行尾的关闭按钮（鼠标悬停时才可见）
            DG_AttachClose(Line);

            return Line;
        }


        /* ---------------------------------------------------------------------------
         * 【工具】登记一行，方便撤回时找到
         * -------------------------------------------------------------------------*/
        function DG_Track(Line, MsgID) {
            if (MsgID) DG_Dom.Lines.set(MsgID, Line);
        }


        /* ---------------------------------------------------------------------------
         * 【普通弹幕】追加到下方列表
         * -------------------------------------------------------------------------*/
        function DG_AddDanmaku(Data) {
            const Hit = DG_Match(Data.msg);
            if (!Hit) return;

            if (DG_IsDuplicate(Data.uid + "|" + Data.msg)) return;

            const Line = DG_BuildLine({
                uid: Data.uid,
                uname: Data.uname,
                text: Hit.Text,
                isSC: false,
                msgID: Data.msg_id
            });

            DG_Track(Line, Data.msg_id);

            // 普通弹幕永远追加在末尾：从上往下按时间顺序排列
            DG_Dom.DmZone.appendChild(Line);
            DG_DanmakuOrder.push(Line);

            // 超出上限就丢掉最旧的一行
            while (DG_DanmakuOrder.length > DG_Config.MaxDanmaku) {
                const Old = DG_DanmakuOrder.shift();
                // 记得同时从登记表里摘掉，否则Map会一直变大（内存泄漏）
                if (Old && Old.dataset.msgId) DG_Dom.Lines.delete(Old.dataset.msgId);
                if (Old) Old.remove();
            }

            // 出现第一条内容后把提示收起来
            if (DG_Dom.Tip) DG_Dom.Tip.style.display = "none";

            // 打完卡自动滚到底部，保证最新一条可见
            DG_AutoScroll();
        }


        /* ---------------------------------------------------------------------------
         * 【SC】插到顶部最前面（prepend），最新的永远在最上面
         * -------------------------------------------------------------------------*/
        function DG_AddSC(Data) {
            const Hit = DG_Match(Data.message);
            if (!Hit) return;

            if (DG_IsDuplicate(Data.uid + "|" + Data.message)) return;

            const Line = DG_BuildLine({
                uid: Data.uid,
                uname: Data.uname,
                text: Hit.Text,
                isSC: true,
                msgID: Data.msg_id
            });

            DG_Track(Line, Data.msg_id);

            // 关键：prepend，插到最顶上
            DG_Dom.SCZone.prepend(Line);

            // SC区也限个长度，防止越堆越长
            while (DG_Dom.SCZone.childElementCount > DG_Config.MaxSC) {
                const Old = DG_Dom.SCZone.lastElementChild;
                // 同样要摘掉登记表里的记录
                if (Old && Old.dataset.msgId) DG_Dom.Lines.delete(Old.dataset.msgId);
                if (Old) Old.remove();
            }

            if (DG_Dom.Tip) DG_Dom.Tip.style.display = "none";
        }


        /* ---------------------------------------------------------------------------
         * 【SC撤回】按 msg_id / message_id 找到那一行删掉
         * -------------------------------------------------------------------------*/
        function DG_RemoveSC(Data) {
            let Line = null;

            // 优先按 msg_id 找
            if (Data.msg_id && DG_Dom.Lines.has(Data.msg_id)) {
                Line = DG_Dom.Lines.get(Data.msg_id);
                DG_Dom.Lines.delete(Data.msg_id);
            }

            // 找不到就退而求其次，用 message_id 全量扫一遍
            if (!Line && Data.message_id !== undefined) {
                const Wanted = String(Data.message_id);
                DG_Dom.Lines.forEach((El, Key) => {
                    if (Line) return;
                    // 之前登记时用的可能是 msg_id，所以这里顺便比对 dataset
                    if (String(El.dataset.msgId) === Wanted ||
                        El.dataset.messageId === Wanted) {
                        Line = El;
                        DG_Dom.Lines.delete(Key);
                    }
                });
            }

            if (!Line) return;

            // 复用统一的删除逻辑：淡出 + 清理登记表 + 清理顺序数组
            DG_RemoveLine(Line, true);
        }


        /* ---------------------------------------------------------------------------
         * 【滚动】让最新弹幕始终可见
         * -------------------------------------------------------------------------*/
        function DG_AutoScroll() {
            // 页面不滚动，改用OBS浏览器源自带的滚动不方便，所以这里做“容器内自动滚动”
            // 给 #DG_DmZone 设 max-height 之后，这里滚动的就是它
            // 没设 max-height 时 scrollHeight === clientHeight，等于什么都不做
            DG_Dom.DmZone.scrollTo({
                top: DG_Dom.DmZone.scrollHeight,
                behavior: "smooth"
            });
        }


        /* ============================================================================
         *  【事件绑定区】开始对接 PlayWithMe.js
         *
         *  整段只在“显示页”执行。
         *  设置页不绑定任何事件、也不连开平长链——否则主播一打开设置面板，
         *  就会被SDK的“请提供您的主播身份码”弹窗糊一脸。
         * ==========================================================================*/
        if (!DG_IsSettingPage) {

        // 新弹幕
        BiLive_PlayWithMeJS.NewDanmaku = (Data) => {
            // Data 就是 OpenLive 的 data 对象，字段：msg / uid / uname / uface / msg_id ...
            DG_AddDanmaku(Data);
        };

        // 新SC
        BiLive_PlayWithMeJS.NewSC = (Data) => {
            // 注意SC的正文在 Data.message，不是 Data.msg
            DG_AddSC(Data);
        };

        // SC撤回
        BiLive_PlayWithMeJS.DelSC = (Data) => {
            DG_RemoveSC(Data);
        };

        // 开平长链连接成功
        BiLive_PlayWithMeJS.AppStarted = (Data) => {
            console.log("[点怪插件] 开平长链已建立，开始监听直播间：" + Data.data.anchor_info.room_id);
            if (DG_Dom.Tip) {
                DG_Dom.Tip.textContent = "已连接到直播间 " + Data.data.anchor_info.room_id + "，等待“点怪”弹幕…";
            }
        };

        // 掉线提示
        BiLive_PlayWithMeJS.WSClientDisconnect = (Evt) => {
            console.warn("[点怪插件] 开平长链掉线", Evt);
            if (DG_Dom.Tip) {
                DG_Dom.Tip.style.display = "";
                DG_Dom.Tip.textContent = "开平长链已掉线，请刷新页面重连";
            }
        };


        /* ---------------------------------------------------------------------------
         * 【补丁】修复SDK里 SC撤回 事件的BUG
         *
         * BiLive_PlayWithMe.js 收到 LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL 时调用的是
         *   BiLive_PlayWithMeJS.SCDel(Msg.data)
         * 但SDK对外声明、Demo里用的都是
         *   BiLive_PlayWithMeJS.DelSC
         * 结果就是 SCDel 不存在 → 抛异常 → 撤回事件根本不会触发。
         *
         * 这里给它别名指向我们绑好的 DelSC，属于外部补丁，不动SDK源码。
         * 如果你已经把SDK第599行改成了 DelSC，那这段可以直接删掉。
         * -------------------------------------------------------------------------*/
        BiLive_PlayWithMeJS.SCDel = (Data) => BiLive_PlayWithMeJS.DelSC(Data);

        } // ← 显示页专用事件绑定区结束


        /* ============================================================================
         *  【可选】本地模拟测试
         *  不想开播就想看效果时，在控制台执行：
         *      DG_Test()
         *  或喂真实数据：
         *      BiLive_PlayWithMeJS.Test({ "cmd":"LIVE_OPEN_PLATFORM_DM", "data":{ ... } })
         * ==========================================================================*/
        window.DG_Test = function () {
            // 两条普通弹幕
            BiLive_PlayWithMeJS.Test({
                "cmd": "LIVE_OPEN_PLATFORM_DM",
                "data": {
                    "uid": 10086, "uname": "测试用户A", "msg": "点怪 我点了个大怪",
                    "msg_id": "test-dm-1", "timestamp": 1650717881
                }
            });
            BiLive_PlayWithMeJS.Test({
                "cmd": "LIVE_OPEN_PLATFORM_DM",
                "data": {
                    "uid": 10087, "uname": "测试用户B", "msg": "这条不该显示",
                    "msg_id": "test-dm-2", "timestamp": 1650717882
                }
            });

            // 一条SC
            BiLive_PlayWithMeJS.Test({
                "cmd": "LIVE_OPEN_PLATFORM_SUPER_CHAT",
                "data": {
                    "uid": 1270482, "uname": "测试金主", "message": "点怪 我出30块点这只",
                    "message_id": 3992851, "msg_id": "test-sc-1", "rmb": 30,
                    "timestamp": 1652413567
                }
            });

            // 3秒后撤回刚才那条SC
            setTimeout(() => {
                BiLive_PlayWithMeJS.Test({
                    "cmd": "LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL",
                    "data": { "message_id": 3992851, "msg_id": "test-sc-1", "uid": 1270482 }
                });
            }, 3000);

            console.log("[点怪插件] 模拟数据已注入：2条弹幕 + 1条SC（3秒后撤回）");
        };


        /* ============================================================================
         *  【必填】插件配置
         *  这一段设置页也要执行：AppID 与签名器是SDK的静态字段，
         *  设置页里赋值不会有任何副作用（只要不调 Init 就不会发起请求）。
         * ==========================================================================*/

        // 开放平台应用ID，见 https://open-live.bilibili.com/open-manage 插件详情页
        BiLive_PlayWithMeJS.AppID = 1792520717598;

        // 本地自签（开发者Key），来自 MyOpenLiveKey.js
        // - 只在“本地自签”这条路上才用得到，线上代签完全不需要
        // - MyOpenLiveKey.js 可能不存在（线上发布时应该删掉），所以必须判存在再取，
        //   否则会抛 MyOpenLiveKey is not defined，把整个脚本打断
        if (typeof MyOpenLiveKey !== "undefined") {
            BiLive_PlayWithMeJS_Authorizer.BiliOpenLiveAccessKey = MyOpenLiveKey.AccessKey;
            BiLive_PlayWithMeJS_Authorizer.BiliOpenLiveSecretKey = MyOpenLiveKey.SecretKey;
        } else {
            console.log("[点怪插件] 未检测到 MyOpenLiveKey.js，本地自签不可用（线上代签不受影响）");
        }

        // 第三方代签（二选一，填了就会覆盖上面的本地自签，也不会再弹身份码窗）
        // 这是给主播正式使用时唯一可行的路：
        //   ① 同源代签：填你自己域名下的接口，需要后端配合
        //   ② JSONP代签：跨域也能用，只需一个能返回JS的接口
        // BiLive_PlayWithMeJS_Authorizer.SameOriginAuthorizerServer = "https://你的域名/api/authorize";
        // BiLive_PlayWithMeJS_Authorizer.JSONPAuthorizerServer = "https://你的域名/api/authorize_jsonp";
        BiLive_PlayWithMeJS_Authorizer.SameOriginAuthorizerServer = "";
        BiLive_PlayWithMeJS_Authorizer.JSONPAuthorizerServer = "";

        // 主播身份码不要写死！给主播用网址参数传：
        //   点怪弹幕插件.html?CODE=BNB1RBFZQ96O4
        // 没传的话SDK会自动弹窗索要身份码。

        // 最后一步：启动
        // 只有显示页才启动开平长链；设置页到此为止
        if (!DG_IsSettingPage) {
            // ===== STANDARD_CODESIGN_PATCH（由 生成index.js 自动插入，勿手改）=====
        // 说明：BiLive_PlayWithMeJS.Init() 的原逻辑是
        //   "URL里没有 CODE 参数 → 弹出身份码索要窗"
        // 但平台上架后，平台下发的是 CODESIGN 而不是 CODE，
        // 于是主播打开插件会莫名被索要身份码。
        // 这里包一层：只要检测到 CODESIGN，就跳过弹窗，直接走 AppStart。
        // 本补丁只存在于生产副本(由 生成index.js 插入)，源文件一个字都没改，
        // 所以本地调试时该弹窗还是照常弹，方便你手动填身份码。
        (function () {
            const OrigInit = BiLive_PlayWithMeJS.Init;

            BiLive_PlayWithMeJS.Init = function () {
                // 不带 hook 的原调用：让它解析URL参数、填充 Paramaters
                OrigInit.apply(this, arguments);

                const HasCodeSign = BiLive_PlayWithMeJS.Paramaters.has("CODESIGN");
                const HasCode = BiLive_PlayWithMeJS.Paramaters.has("CODE");

                if (HasCodeSign && !HasCode) {
                    // 关掉SDK误弹的索码窗
                    if (typeof BiLive_PlayWithMeJS_AuthDialog !== "undefined") {
                        try { BiLive_PlayWithMeJS_AuthDialog.Hide(); } catch (E) { }
                    }
                    console.log("[点怪插件] 检测到平台下发的 CODESIGN，跳过身份码窗，直接申请启动");
                    BiLive_PlayWithMeJS.AppStart();
                }
            };
        })();

        BiLive_PlayWithMeJS.Init();
        } else {
            console.log("[点怪插件] 当前为设置页 (plug_env=1)，不启动开平长链");
        }

        // 按运行模式切换界面
        // 放在脚本最后执行：此时设置页与显示区的DOM都已经解析完毕
        DG_ApplyPageMode();
    </script>
