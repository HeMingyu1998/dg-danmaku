<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta http-equiv="content-language" content="zh-CN">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="renderer" content="webkit">

    <!-- 必须：允许屏蔽 Referrer，否则拉取B站头像/表情会被腾讯云图库拦截 -->
    <meta content="never" name="referrer">

    <title>点怪弹幕插件 - PlayWithMe.js</title>

    <!-- https://github.com/h2non/jshashes -->
    <script src="./Lib/h2non/jshashes.min.js" type="text/javascript"></script>
    <!-- https://github.com/XL7Z/BiliBili_PlayWithMe.js -->
    <script src="./Lib/PlayWithMe.js/BiLive_PlayWithMe.js" type="text/javascript"></script>
    <!-- 本地自签用的开发者密钥。发布时请删除本行与本文件 -->

    <style>
        /* ================= 透明底，方便直接当OBS浏览器源叠加 ================= */
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
            /* 高度链必须完整：html 和 body 都要有确定高度，
               下面的 #DG_Root height:100% 才有参照物。
               否则百分比高度会退化成 auto，#DG_DmZone 的 overflow:hidden
               就会失效（高度不定时 overflow 不生效），弹幕区又会无限长高。 */
            height: 100%;
        }

        /* 调试时可把 background 改成 #0008 看看区域范围 */
        /* 100% 而不是 100vw：显示页的尺寸由直播姬 iframe 决定，
           用 % 才能正确跟随父级容器，也不会被滚动条宽度影响 */
        #DG_Root {
            width: 100%;
            height: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            /* 字号变量：设置页保存后由JS覆盖。
               放在这里当默认值，即使JS没跑也有合理字号。 */
            --dg-font-size: 22px;
        }

        /* ================= 面板外框（DG_Config.ShowPanel 控制） ================= */
        /* 效果：整个列表外围一圈绿框 + 圆角 + 半透明暗底
           注意：颜色、粗细、圆角、底色全部由JS从 DG_Config 读取后写进行内样式，
           所以这里只放"不随配置变化"的部分。
           这样做的好处是改颜色不用碰CSS，改一个配置值就行 */
        #DG_Root.DG_Panel {
            /* 内边距要略大，否则内容贴着边框不好看 */
            padding: 14px 18px;
        }

        /* 面板标题：默认不显示，DG_Config.PanelTitle 非空时由JS填字并显示 */
        #DG_PanelTitle {
            display: none;
            flex: 0 0 auto;
            color: #FFFFFF;
            font-size: .95em;
            font-weight: 700;
            letter-spacing: .04em;
            padding-bottom: 8px;
            margin-bottom: 2px;
            border-bottom: 1px dashed rgba(255, 255, 255, .18);
            text-shadow:
                0 0 2px #000,
                1px 1px 0 #000,
                -1px -1px 0 #000;
        }

        /* ================= 设置页（plug_env=1） ================= */
        /* 设置页在直播姬的设置面板里打开，是白底UI，所以这里用深色文字 */
        /* 默认隐藏，由JS按运行模式决定显示哪一个，避免页面加载时闪现 */
        #DG_Settings {
            display: none;
            width: 100%;
            min-height: 100%;
            box-sizing: border-box;
            padding: 20px;
            background: #FFFFFF;
            color: #333333;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: auto;
        }

        #DG_Settings h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #222222;
        }

        #DG_Settings .DG_Row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #DG_Settings label {
            min-width: 84px;
            color: #555555;
        }

        #DG_Settings input[type="number"] {
            width: 96px;
            height: 32px;
            box-sizing: border-box;
            padding: 0 8px;
            font-size: 14px;
            color: #333333;
            background: #FFFFFF;
            border: 1px solid #D9D9D9;
            border-radius: 6px;
            outline: none;
        }

        #DG_Settings input[type="number"]:focus {
            border-color: #FF6699;
        }

        #DG_Settings button {
            height: 32px;
            padding: 0 16px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #D9D9D9;
            background: #FFFFFF;
            color: #333333;
            cursor: pointer;
        }

        #DG_Settings button:hover {
            border-color: #FF6699;
            color: #FF6699;
        }

        #DG_Settings button.DG_Primary {
            background: #FF6699;
            border-color: #FF6699;
            color: #FFFFFF;
        }

        #DG_Settings button.DG_Primary:hover {
            background: #E85A8A;
            border-color: #E85A8A;
            color: #FFFFFF;
        }

        /* 预览区：按比例缩小展示显示区的形状 */
        #DG_PreviewWrap {
            height: 200px;
            box-sizing: border-box;
            padding: 8px;
            border: 1px dashed #D9D9D9;
            border-radius: 8px;
            background: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #DG_Preview {
            /* 棋盘格背景，一眼能看出"透明"/"非透明" */
            background-color: #FFFFFF;
            background-image:
                linear-gradient(45deg, #E8E8E8 25%, transparent 25%, transparent 75%, #E8E8E8 75%),
                linear-gradient(45deg, #E8E8E8 25%, transparent 25%, transparent 75%, #E8E8E8 75%);
            background-size: 12px 12px;
            background-position: 0 0, 6px 6px;
            border: 1px solid #BBBBBB;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888888;
            font-size: 12px;
        }

        #DG_Status {
            min-height: 20px;
            font-size: 13px;
            color: #22AA66;
        }

        #DG_Status.DG_Err {
            color: #E23C3C;
        }

        /* 探针结果：等宽字体，方便整体复制 */
        #DG_Probe {
            margin: 0;
            padding: 10px;
            background: #F5F5F5;
            border: 1px solid #E3E3E3;
            border-radius: 6px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #444444;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* 摘要：视觉上要跳出来，因为它才是"结论" */
        #DG_ProbeSummary {
            margin: 0;
            padding: 12px;
            background: #FFF8E6;
            border: 1px solid #FFD980;
            border-left: 5px solid #FFB300;
            border-radius: 6px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #6B4A00;
            font-weight: 600;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* 完整探针：太长的部分自己滚动，不把页面撑得没边 */
        #DG_Probe {
            max-height: 220px;
            overflow: auto;
        }

        .DG_Hint {
            font-size: 12px;
            color: #999999;
            line-height: 1.6;
        }

        /* ================= 显示区尺寸控制 ================= */
        /* 设置页保存了尺寸时，用 DG_Sized 类让 #DG_Root 按固定像素渲染；
           没保存过则不加这个类，#DG_Root 保持 width/height:100% 自适应。

           为什么要居中：
             直播姬里浏览器素材的宽高是独立的，可能比设置值大。
             不居中的话，内容会缩在左上角，看起来像"坏了"。
             居中后视觉上是"居中的面板"，像是有意为之。 */
        body.DG_Centered {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #DG_Root.DG_Sized {
            /* 尺寸由JS按保存值写入行内样式，这里只负责取消自适应 */
            width: auto;
            height: auto;
            flex: 0 0 auto;
        }

        /* ================= 设置页里的折叠块 ================= */

        /* 用于把"预览"和"环境探针"收起来，避免挤占表单的可见空间 */
        #DG_Settings details {
            border: 1px solid #E3E3E3;
            border-radius: 6px;
            background: #FAFAFA;
            padding: 0 10px;
        }

        #DG_Settings summary {
            cursor: pointer;
            padding: 10px 0;
            font-size: 13px;
            color: #666666;
            user-select: none;
            outline: none;
            /* 去掉浏览器默认的三角，自己加一个，位置更可控 */
            list-style: none;
        }

        #DG_Settings summary::-webkit-details-marker {
            display: none;
        }

        #DG_Settings summary::before {
            content: "▸ ";
            color: #FF6699;
            font-weight: 700;
        }

        /* 展开状态换一个朝下的箭头 */
        #DG_Settings details[open] summary::before {
            content: "▾ ";
        }

        #DG_Settings details[open] summary {
            border-bottom: 1px solid #E3E3E3;
            margin-bottom: 10px;
        }

        /* 折叠块里的内容底部留点空，别贴着边框 */
        #DG_Settings details>*:last-child {
            margin-bottom: 10px;
        }

        /* ================= 顶部堆叠区：只放“点怪”开头的SC ================= */
        /* 新SC插到最前面，于是最新的永远在最上面 */
        /*
         * 空间分配策略：SC区优先，弹幕区分剩余高度
         *
         * flex: 0 0 auto  = 不伸不长，只按内容自然高度占位
         *   → SC有几条就占多高，不会被弹幕区抢走空间
         * max-height      = 安全阀，由JS按 DG_Config.ScZoneMaxPercent 写入
         *   → 没有它的话，SC太多会把弹幕区挤成0高度，就变成"弹幕全看不见"了
         * min-height: 0   = 允许收缩（配合 overflow 才能裁剪）
         * overflow:hidden = 裁掉最底部那些"最旧的SC"
         */
        #DG_SCZone {
            display: flex;
            flex-direction: column;
            /* em：字号变大时SC之间的间距也跟着变大，比例保持一致 */
            gap: .3em;
            flex: 0 0 auto;
            min-height: 0;
            overflow: hidden;
        }

        /* ================= 下方弹幕区 ================= */
        /* 从上往下排：DOM 顺序 = 视觉顺序，新的追加在下面
         *
         * 1) flex:1 1 auto + min-height
         *    吃掉SC区之外的剩余高度。SC区优先占位，这里分剩下的。
         *    min-height 由JS按 DG_Config.DanmakuMinHeight 写入，
         *    作为"保底"：万一SC特别多，也不会把弹幕区压成0高度。
         *    （flex项默认 min-height:auto 会被内容撑开，
         *      所以必须显式给一个值，overflow 才会生效）
         *
         * 2) overflow: hidden
         *    关键：溢出的行【保留在DOM里，只是不显示】。
         *    删掉上方的某行后，下面的行会自动往上补位 —— 这是
         *    文档流的天然行为，不需要任何JS干预。
         *
         *    （之前用的是 column-reverse + 自动淘汰旧行，
         *      那样新行贴底、旧行被真删掉，与这里的要求相反）
         */
        #DG_DmZone {
            display: flex;
            flex-direction: column;
            /* 行距由 .DG_Line 的上下padding撑开，这里用0更紧凑 */
            gap: 0;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .DG_Line {
            display: flex;
            align-items: baseline;
            gap: .5em;
            line-height: 1.45;
            /* 字号由CSS变量控制，设置页可以改。
               默认值写在 #DG_Root 上，这里只负责引用 ——
               这样JS改一处变量，所有行一起变。 */
            font-size: var(--dg-font-size, 22px);
            color: #FFFFFF;

            /* ---- 行左侧竖线：默认关闭，由 DG_Config.RowLeftBar 控制 ---- */
            /* 你要的是"整个列表一圈框"，所以这个默认不开。
               开启时由JS加 .DG_LeftBar 类，样式在下面定义 */
            padding-left: 4px;
            /* 上下留白用 em 而不是 px：字号调大时行距跟着变大，
               否则字变大了行还挤在一起 */
            padding-top: .28em;
            padding-bottom: .28em;

            /* 不再用整行黑底：列表风格本身就是"轻量"的，
               加背景块会显得笨重。文字靠 text-shadow 保证可读性 */
            background: transparent;

            /* 保证在任何画面上都看得清（OBS必备） */
            text-shadow:
                0 0 2px #000,
                0 0 4px #000,
                1px 1px 0 #000,
                -1px 1px 0 #000,
                1px -1px 0 #000,
                -1px -1px 0 #000;

            /* 长文本自动折行，不撑破OBS窗口 */
            word-break: break-word;
            overflow-wrap: anywhere;
            animation: DG_In .18s ease-out;
        }

        /* 可选的"每行左侧竖线"（DG_Config.RowLeftBar = true 时由JS加上） */
        .DG_Line.DG_LeftBar {
            border-left: 3px solid #4CE86B;
            padding-left: 10px;
        }

        /* 高亮闪烁一下，方便主播一眼看到新的一条 */
        @keyframes DG_In {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* 被撤掉的SC做一个淡出，然后由JS移除 */
        .DG_Removing {
            animation: DG_Out .3s ease-in forwards;
        }

        @keyframes DG_Out {
            to {
                opacity: 0;
                transform: translateX(16px);
            }
        }

        /* ================= 每行的关闭按钮 ================= */
        /* 平常完全隐藏、不占位；鼠标移到这一行上才出现 */
        /* 给右侧预留位置，避免按钮浮在文字上面 */
        /* 用 em 而不是 px：字号调大时按钮和预留空间一起变大，
           否则字号大了按钮会显得很小、还容易被文字压住 */
        .DG_Line {
            position: relative;
            padding-right: 1.2em;
        }

        .DG_Close {
            position: absolute;
            right: .1em;
            top: 50%;
            transform: translateY(-50%);
            width: .92em;
            height: .92em;
            line-height: .84em;
            text-align: center;
            border-radius: 50%;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .55);
            color: #FFFFFF;
            font-size: .64em;
            font-weight: 700;
            cursor: pointer;
            /* 关键：默认不可见也不吃鼠标事件，免得它在行尾挡住别的东西 */
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s;
            /* 别被上面的 text-shadow 影响 */
            text-shadow: none;
            user-select: none;
        }

        /* 悬停整行时按钮才出现，并恢复可点击 */
        .DG_Line:hover .DG_Close {
            opacity: 1;
            pointer-events: auto;
        }

        .DG_Close:hover {
            background: #FF4D6A;
            border-color: #FFFFFF;
        }

        /* 用户昵称：SC 和普通弹幕都是白色 */
        .DG_User {
            flex: 0 0 auto;
            color: #FFFFFF;
            font-weight: 700;
            font-size: .82em;
            letter-spacing: .02em;
        }

        /* 序号：参考"弹幕列表"样式的 1. 2. 3. */
        /* 固定宽度 + 右对齐，这样数字位数不同也能对齐成一列 */
        .DG_Index {
            flex: 0 0 auto;
            width: 1.8em;
            text-align: right;
            color: #FFFFFF;
            font-weight: 700;
            opacity: .75;
        }

        /* 分隔符 */
        .DG_Sep {
            flex: 0 0 auto;
            opacity: .55;
        }

        /* 消息正文 */
        /* 默认绿色 = 普通弹幕；SC 由下面的 .DG_SC .DG_Text 覆盖成红色 */
        .DG_Text {
            flex: 0 1 auto;
            min-width: 0;
            color: #4CE86B;
        }

        /* ================= SC 行 ================= */
        /* 外观与普通弹幕完全一致，唯一区别就是文本颜色 */
        .DG_SC .DG_Text {
            color: #FF5C5C;
        }

        /* 设置页提示（plug_env=1 且还没开播时用得上） */
        #DG_Tip {
            font-size: 15px;
            color: #FFF;
            text-shadow: 0 0 3px #000, 1px 1px 0 #000;
            opacity: .85;
        }

        /* ================= 显示页右上角的设置入口 ================= */
        /* 刻意做得很低调：默认几乎透明，鼠标移上去才明显，不干扰直播画面 */
        #DG_SettingEntry {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 9999;
            display: block;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .45);
            color: #FFF;
            font-size: 13px;
            line-height: 1.6;
            text-decoration: none;
            opacity: .18;
            transition: opacity .2s;
            cursor: pointer;
        }

        #DG_SettingEntry:hover {
            opacity: 1;
            background: #FF6699;
        }
    </style>
</head>

<body>

    <!-- ============ 显示页（plug_env=0）：正常渲染弹幕 ============ -->
    <div id="DG_Root">
        <!-- 面板标题：默认隐藏，DG_Config.PanelTitle 非空时才显示 -->
        <div id="DG_PanelTitle"></div>
        <!-- 顶部：点怪SC堆叠区，新的插在最上面 -->
        <div id="DG_SCZone"></div>
        <!-- 下方：点怪弹幕逐行显示区 -->
        <div id="DG_DmZone"></div>
        <div id="DG_Tip">等待主播身份码 / 等待“点怪”弹幕…</div>
    </div>

    <!-- 显示页右上角的设置入口：点它切到设置页 -->
    <!-- 用 <a> 而不是 button，这样中键/右键新标签打开也能用 -->
    <a id="DG_SettingEntry" href="?plug_env=1" title="打开插件设置">⚙ 设置</a>

    <!-- ============ 设置页（plug_env=1）：给主播填显示区宽高 ============ -->
    <div id="DG_Settings">
        <h3>点怪弹幕 · 插件设置</h3>

        <div class="DG_Row">
            <a id="DG_BackLink" href="?" style="color:#FF6699">← 返回显示页</a>
        </div>

        <!-- ============================================================
             布局原则：主播要用的东西放最上面且一直可见。
             探针是给开发者排查问题用的，必须折叠起来 ——
             否则它会把真正要填的输入框挤出视口，
             变成"打开设置页却找不到能改的地方"。
             ============================================================ -->

        <div class="DG_Row">
            <label for="DG_W">显示区宽度</label>
            <input id="DG_W" type="number" min="1" max="4096" step="1">
            <span>px</span>
        </div>

        <div class="DG_Row">
            <label for="DG_H">显示区高度</label>
            <input id="DG_H" type="number" min="1" max="4096" step="1">
            <span>px</span>
        </div>

        <div class="DG_Row">
            <label for="DG_Font">字体大小</label>
            <input id="DG_Font" type="number" min="8" max="120" step="1">
            <span>px</span>
        </div>

        <div class="DG_Row">
            <button id="DG_Save" class="DG_Primary">保存设置</button>
            <button id="DG_Reset">恢复默认</button>
        </div>

        <div id="DG_Status"></div>

        <div class="DG_Hint">
            <b>这里设的尺寸会和直播姬里素材的宽高共同决定最终效果。</b><br>
            插件无法改变直播姬给你的窗口大小（那是宿主决定的），
            它只能决定"内容占多大"。所以：<br>
            · 建议把这个值填成<b>和浏览器素材的宽高一致</b>，这样正好铺满<br>
            · 如果素材比这里大，内容会居中显示，四周留白<br>
            · 如果素材比这里小，超出部分会被裁掉<br>
            改完后需要<b>刷新显示页</b>（重启素材源或重新添加）才会生效。
        </div>

        <!-- 预览：折叠。想确认比例时展开看一眼即可 -->
        <details>
            <summary>显示区比例预览</summary>
            <div id="DG_PreviewWrap" style="margin-top:10px">
                <div id="DG_Preview">预览</div>
            </div>
        </details>

        <!-- 环境探针：折叠。给开发者排查用，主播不需要关心 -->
        <details>
            <summary>环境探针（排查问题时才需要）</summary>
            <pre id="DG_ProbeSummary" style="margin-top:10px">采集中…</pre>
            <div class="DG_Row">
                <button id="DG_ProbeBtn">重新检测</button>
                <button id="DG_CopyProbe">复制全部结果</button>
            </div>
            <pre id="DG_Probe">采集中…</pre>
        </details>
    </div>

    <script>
        /* ============================================================================
         *  插件名：点怪弹幕 / 点怪SC 收集器
         *  依赖：BiliBili_PlayWithMe.js  (BiLive_PlayWithMe.Full.js)
         *
         *  规则：
         *   1) 普通弹幕 msg 以“点怪”开头  → 追加到底部列表，格式“用户ID - 弹幕文本”
         *   2) SC的 message 以“点怪”开头  → 插到顶部列表最前面（新的在最上面）
         *   3) SC被撤回（LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL）→ 自动移除对应那一行
         *
         *  字段说明（开平长链）：
         *   弹幕 LIVE_OPEN_PLATFORM_DM   : data.msg      / data.uid / data.uname
         *   SC   LIVE_OPEN_PLATFORM_SUPER_CHAT : data.message / data.message_id / data.rmb
         * ==========================================================================*/


        /* ---------------------------------------------------------------------------
         * 【运行模式】直播姬会把同一个HTML加载两次，靠URL参数 plug_env 区分
         *   plug_env=1 → 设置页，只给主播填参数，绝对不能连开平长链
         *   plug_env=0 → 显示页，正常收弹幕渲染
         *   取不到参数时按显示页处理，保证不影响正常出画面
         *
         * 本地调试：
         *   正常页      点怪弹幕插件.html
         *   设置页      点怪弹幕插件.html?plug_env=1
         *   强制设置页  点怪弹幕插件.html?DG_MODE=setting
         * -------------------------------------------------------------------------*/
        const DG_UrlParams = new URLSearchParams(window.location.search);
        const DG_PlugEnv = parseInt(DG_UrlParams.get("plug_env") || "0", 10);
        const DG_ForceMode = (DG_UrlParams.get("DG_MODE") || "").toLowerCase();
        const DG_IsSettingPage = DG_ForceMode === "setting" || DG_PlugEnv === 1;


        /* ---------------------------------------------------------------------------
         * 【配置区】按需要改这里就够了
         * -------------------------------------------------------------------------*/
        const DG_Config = {
            // 触发前缀，不区分前后空格（" 点怪 x  " 也能匹配）
            Prefix: "点怪",
            // 显示时是否保留“点怪”两个字
            //   true  → “12345 - 点怪 打个大怪”
            //   false → “12345 - 打个大怪”      （正文为空时仍会显示“点怪”）
            KeepPrefix: false,
            // 普通弹幕在DOM里的保留上限
            // - 溢出的行是【保留但不显示】（靠CSS裁剪），不是被删掉
            // - 这个值只是个"安全阀"，防止直播几小时后DOM积累过多导致卡顿
            // - 设得足够大，正常一场直播根本碰不到；碰到时丢的是最旧的
            MaxDanmaku: 2000,
            // SC最多保留多少行（DOM里的上限，防止无限堆积）
            MaxSC: 20,

            /* ---------- 空间分配（SC区优先，弹幕区分剩余） ---------- */

            // SC区最多占整个显示区高度的百分比
            // - SC区是"按内容自然高度占位"，这个值只是安全阀
            // - 没有它的话，SC太多会把弹幕区挤成0高度，弹幕就全看不见了
            // - 100 = 完全不限制（不推荐）
            ScZoneMaxPercent: 70,

            // 弹幕区的保底高度（px）
            // - 即使SC区占满，也至少留这么高给弹幕
            // - 设 0 表示不保底，也就是严格"SC优先"
            DanmakuMinHeight: 80,

            /* ---------- 数据来源 ---------- */

            // 是否启用"本地弹幕服务"模式
            //
            //   true  → 优先从本地服务取弹幕（本地程序.js 提供的 WebSocket）
            //           本地服务没开时，会自动回退到 SDK 直连
            //           这是给主播用的模式，不需要上架、不需要身份码
            //
            //   false → 只用 SDK（需要平台上架通道，或本地自签调试）
            UseLocalBridge: true,

            // 本地服务地址。端口要和 本地程序.js 里的 CONFIG.Port 一致
            LocalBridgeUrl: "ws://127.0.0.1:8770",

            // 本地服务的连接重试间隔（毫秒）
            LocalBridgeRetryMs: 3000,
            // 同一秒内同一个人发的一模一样的内容，算重复，直接忽略
            // 弹幕重连时偶尔会重放，开平长链没有原生去重
            DuplicateWindowMs: 1000,
            // 消息正文里如果出现分号或竖线，是否拆成多行显示
            SplitMultiLine: false,

            /* ---------- 面板外观 ---------- */

            // 是否给整个显示区套一层"面板"外框
            //   true  → 整个列表外围一圈边框 + 圆角（截图里的绿框效果，默认）
            //   false → 完全没有外框，文字直接飘在画面上
            ShowPanel: true,

            // 面板边框颜色。这就是"外围那一圈框"的颜色
            PanelBorderColor: "#4CE86B",

            // 面板底色
            //   想要"框里带一层暗底"就填 rgba(0,0,0,.45)
            //   只想要一个空心框、不遮挡画面 → transparent
            PanelBg: "rgba(0, 0, 0, .30)",

            // 边框粗细（px）
            PanelBorderWidth: 2,

            // 圆角（px）
            PanelRadius: 10,

            // 是否给每行左侧也加一条绿色竖线
            //   false → 只有外围一圈框（默认，就是你要的效果）
            //   true  → 框内每行还有自己的竖线（两层线条，比较花）
            RowLeftBar: false,

            // 面板顶部标题。留空 = 不显示标题栏
            // 例："点怪弹幕"
            PanelTitle: "",

            // 是否在每行前面显示序号（1. 2. 3. …）
            //   false → 显示"文本 - 昵称"（默认）
            //   true  → 显示"序号 文本"，类似编号列表
            ShowIndex: false,

            /* ---------- 字号 ---------- */

            // 默认字号（px）
            // - 设置页保存过之后会以保存值为准，这里只是初始默认
            // - 18~26 是比较常用的范围；太小看不清，太大会被裁行
            FontSize: 22,

            // 字号可调范围（px），防止设置页填出离谱数值
            FontSizeMin: 8,
            FontSizeMax: 120
        };


        /* ---------------------------------------------------------------------------
         * 【显示区尺寸】跨页共享
         * - 设置页与显示页是两个独立的JS上下文，变量传不过去
         * - 两者同源，所以用 localStorage 当桥梁
         * - key 带版本号，改默认值时升版本即可让旧值自动失效
         * -------------------------------------------------------------------------*/
        const DG_SizeKey = "DG_Size_V1";

        const DG_DefaultSize = { W: 480, H: 720 };

        // 允许范围，防止离谱数值破坏布局
        const DG_SizeMin = 1;
        const DG_SizeMax = 4096;

        /**
         * 把输入夹紧成合法整数
         * - 这个值最终会进入CSS，所以必须校验，否则等于开了注入口子
         */
        function DG_ClampSize(Value, Fallback) {
            const Num = Math.floor(Number(Value));
            if (!isFinite(Num)) return Fallback;
            return Math.min(DG_SizeMax, Math.max(DG_SizeMin, Num));
        }

        /**
         * 是否"明确保存过"尺寸
         *
         * 这个判断很关键：
         *   - 保存过  → 显示页按保存的像素尺寸渲染（设置真正生效）
         *   - 没保存过 → 显示页保持 100% 自适应，填满直播姬给的窗口
         *
         * 如果不区分，所有人一打开就被强制成 480×720，
         * 窗口更大时会白白留白一圈。
         */
        function DG_HasSavedSize() {
            // URL 显式带了尺寸也算"明确指定"
            const UrlW = DG_UrlParams.get("width") ?? DG_UrlParams.get("W");
            const UrlH = DG_UrlParams.get("height") ?? DG_UrlParams.get("H");
            if (UrlW !== null && UrlH !== null) return true;

            try {
                return localStorage.getItem(DG_SizeKey) !== null;
            } catch (E) {
                return false;
            }
        }

        /**
         * 读取主播保存的尺寸
         * @returns {{W:number,H:number,From:string}} From 标记数据来源，便于排查
         */
        function DG_LoadSize() {
            // 1) 优先用URL参数：如果直播姬真的下发了尺寸，就不需要localStorage了
            const UrlW = DG_UrlParams.get("width") ?? DG_UrlParams.get("W");
            const UrlH = DG_UrlParams.get("height") ?? DG_UrlParams.get("H");
            if (UrlW !== null && UrlH !== null) {
                return {
                    W: DG_ClampSize(UrlW, DG_DefaultSize.W),
                    H: DG_ClampSize(UrlH, DG_DefaultSize.H),
                    From: "URL参数"
                };
            }

            // 2) 退回 localStorage
            try {
                const Raw = localStorage.getItem(DG_SizeKey);
                if (Raw) {
                    const Obj = JSON.parse(Raw);
                    return {
                        W: DG_ClampSize(Obj.W, DG_DefaultSize.W),
                        H: DG_ClampSize(Obj.H, DG_DefaultSize.H),
                        From: "localStorage"
                    };
                }
            } catch (E) {
                // 无痕模式或被策略禁用时会抛异常，忽略即可，用默认值继续
                console.warn("[点怪插件] 读取本地设置失败，使用默认值", E);
            }

            // 3) 都没有，用默认值
            return { W: DG_DefaultSize.W, H: DG_DefaultSize.H, From: "默认值" };
        }

        /**
         * 保存尺寸
         * @returns {boolean} 是否保存成功
         */
        function DG_SaveSize(W, H) {
            try {
                localStorage.setItem(DG_SizeKey, JSON.stringify({
                    W: DG_ClampSize(W, DG_DefaultSize.W),
                    H: DG_ClampSize(H, DG_DefaultSize.H)
                }));
                return true;
            } catch (E) {
                console.warn("[点怪插件] 保存本地设置失败", E);
                return false;
            }
        }

        /**
         * 清掉保存的尺寸，回到默认值
         */
        function DG_ClearSize() {
            try {
                localStorage.removeItem(DG_SizeKey);
                return true;
            } catch (E) {
                return false;
            }
        }


        /* ---------------------------------------------------------------------------
         * 【字号】跨页共享
         * - 和尺寸一样，靠 localStorage 在设置页与显示页之间传递
         * - 单独一个key，这样"恢复默认"可以分别重置
         * -------------------------------------------------------------------------*/
        const DG_FontKey = "DG_Font_V1";

        /**
         * 夹紧字号
         */
        function DG_ClampFont(Value, Fallback) {
            const Num = Math.floor(Number(Value));
            if (!isFinite(Num)) return Fallback;
            return Math.min(DG_Config.FontSizeMax,
                Math.max(DG_Config.FontSizeMin, Num));
        }

        /**
         * 是否明确保存过字号
         * - 没保存过就用 DG_Config.FontSize 作为默认
         */
        function DG_HasSavedFont() {
            try {
                return localStorage.getItem(DG_FontKey) !== null;
            } catch (E) {
                return false;
            }
        }

        /**
         * 读取字号
         * @returns {{Size:number, From:string}}
         */
        function DG_LoadFont() {
            const Fallback = DG_ClampFont(DG_Config.FontSize, 22);
            try {
                const Raw = localStorage.getItem(DG_FontKey);
                if (Raw !== null) {
                    return { Size: DG_ClampFont(Raw, Fallback), From: "localStorage" };
                }
            } catch (E) { }
            return { Size: Fallback, From: "配置默认值" };
        }

        /**
         * 保存字号
         */
        function DG_SaveFont(Size) {
            try {
                localStorage.setItem(DG_FontKey,
                    String(DG_ClampFont(Size, DG_Config.FontSize)));
                return true;
            } catch (E) {
                console.warn("[点怪插件] 保存字号失败", E);
                return false;
            }
        }

        function DG_ClearFont() {
            try {
                localStorage.removeItem(DG_FontKey);
                return true;
            } catch (E) {
                return false;
            }
        }


        /* ---------------------------------------------------------------------------
         * 【DOM】一次取好，别每次事件都查DOM
         * -------------------------------------------------------------------------*/
        const DG_Dom = {
            SCZone: document.getElementById("DG_SCZone"),
            DmZone: document.getElementById("DG_DmZone"),
            Tip: document.getElementById("DG_Tip"),
            Lines: new Map() // msg_id → 行元素，用于撤回时精准删除
        };

        // 普通弹幕是否发生了溢出，需要一个数组记住顺序
        const DG_DanmakuOrder = [];

        // 累计收到的"点怪"弹幕条数，用作序号来源
        // 注意它只增不减：删掉中间某行后，后面行的编号不会重排
        let DG_TotalDanmaku = 0;


        /**
         * 把设置页保存的宽高应用到显示页
         *
         * 行为：
         *   保存过尺寸 → #DG_Root 按固定像素渲染，并在窗口里居中
         *   没保存过   → 保持 100% 自适应，填满直播姬给的窗口
         *
         * 注意：这里改变的是"内容占多大"，不是"窗口多大"。
         * 直播姬里浏览器素材的宽高由宿主决定，页面无权修改。
         * 所以设置值最好和素材宽高填成一致，否则周围会留白。
         */
        function DG_ApplySizeControl() {
            const Root = document.getElementById("DG_Root");
            if (!Root) return;

            if (!DG_HasSavedSize()) {
                // 没保存过：保持自适应
                Root.classList.remove("DG_Sized");
                Root.style.width = "";
                Root.style.height = "";
                document.body.classList.remove("DG_Centered");
                return;
            }

            const Size = DG_LoadSize();
            Root.classList.add("DG_Sized");
            Root.style.width = Size.W + "px";
            Root.style.height = Size.H + "px";

            // 居中的意义：窗口比设置值大时，内容不会缩在左上角
            document.body.classList.add("DG_Centered");

            console.log(`[点怪插件] 显示区按设置渲染: ${Size.W} × ${Size.H}（来源：${Size.From}）`);
        }


        /**
         * 把设置页保存的字号应用到显示页
         *
         * 实现方式：写 CSS 变量 --dg-font-size。
         * 为什么用变量而不是直接改 .DG_Line 的 font-size：
         *   行内的 padding、关闭按钮尺寸、SC间距都用了 em，
         *   它们会自动跟着根字号缩放。改一处变量，整块面板比例一起变。
         */
        function DG_ApplyFontSize() {
            const Root = document.getElementById("DG_Root");
            if (!Root) return;

            const Font = DG_LoadFont();
            Root.style.setProperty("--dg-font-size", Font.Size + "px");

            console.log(`[点怪插件] 字号: ${Font.Size}px（来源：${Font.From}）`);
        }


        /* ---------------------------------------------------------------------------
         * 【面板外观】按 DG_Config 决定外框、标题、行左侧竖线
         * - 颜色/粗细/圆角/底色都从配置读，写进行内样式
         *   这样改配色不用碰CSS，也不用担心CSS里写死后忘记同步
         * -------------------------------------------------------------------------*/
        function DG_ApplyPanelStyle() {
            const Root = document.getElementById("DG_Root");
            const Title = document.getElementById("DG_PanelTitle");
            if (!Root) return;

            // ---------- 外框 ----------
            if (DG_Config.ShowPanel) {
                Root.classList.add("DG_Panel");
                // 行内样式优先级高于CSS类，所以配置值总是说了算
                Root.style.background = DG_Config.PanelBg;
                Root.style.border =
                    DG_Config.PanelBorderWidth + "px solid " + DG_Config.PanelBorderColor;
                Root.style.borderRadius = DG_Config.PanelRadius + "px";
            } else {
                Root.classList.remove("DG_Panel");
                // 必须显式清掉，否则关掉开关后旧的行内样式还留着
                Root.style.background = "";
                Root.style.border = "";
                Root.style.borderRadius = "";
            }

            // ---------- 标题 ----------
            if (Title) {
                const Text = (DG_Config.PanelTitle || "").trim();
                if (Text.length > 0) {
                    Title.textContent = Text;
                    Title.style.display = "";
                } else {
                    Title.style.display = "none";
                }
            }

            // ---------- 每行左侧竖线 ----------
            DG_ApplyLeftBar();

            // ---------- 空间分配：SC区优先，弹幕区分剩余 ----------
            DG_ApplyZoneSizing();
        }

        /**
         * 空间分配策略：SC区优先占位，弹幕区分剩余高度
         *
         * - SC区：flex:0 0 auto 让它按内容自然高度占位（CSS里已定），
         *   这里只写一个 max-height 安全阀，防止它把弹幕区挤没
         * - 弹幕区：flex:1 1 auto 吃剩余（CSS里已定），
         *   这里写一个 min-height 保底
         *
         * 用百分比而不是像素给SC区，是为了跟随直播姬的框高自适应：
         * 框高600和框高1080，70%对应的实际像素是不同的，这样两种尺寸都合理
         */
        function DG_ApplyZoneSizing() {
            if (DG_Dom.SCZone) {
                const Pct = Number(DG_Config.ScZoneMaxPercent);
                if (isFinite(Pct) && Pct > 0 && Pct < 100) {
                    DG_Dom.SCZone.style.maxHeight = Pct + "%";
                } else {
                    // 100 或非法值 = 不限制
                    DG_Dom.SCZone.style.maxHeight = "none";
                }
            }

            if (DG_Dom.DmZone) {
                const Min = Number(DG_Config.DanmakuMinHeight);
                DG_Dom.DmZone.style.minHeight =
                    (isFinite(Min) && Min > 0 ? Min : 0) + "px";
            }
        }

        /**
         * 给已存在的每一行加上/去掉左侧竖线
         * - 新增的行在 DG_BuildLine 里处理
         * - 这个函数负责"开关改了之后，把已有的行也同步过来"
         * - 左右两个区都要扫：SC 区和弹幕区
         */
        function DG_ApplyLeftBar() {
            const On = !!DG_Config.RowLeftBar;
            [DG_Dom.SCZone, DG_Dom.DmZone].forEach((Zone) => {
                if (!Zone) return;
                Zone.querySelectorAll(".DG_Line").forEach((Line) => {
                    Line.classList.toggle("DG_LeftBar", On);
                });
            });
        }


        /* ---------------------------------------------------------------------------
         * 【模式分流】按运行模式决定显示哪一个界面
         * - 设置页：显示设置表单，隐藏显示区，且绝不启动开平长链
         * - 显示页：显示渲染区，隐藏设置表单
         * -------------------------------------------------------------------------*/
        function DG_ApplyPageMode() {
            const Root = document.getElementById("DG_Root");
            const Settings = document.getElementById("DG_Settings");
            const Entry = document.getElementById("DG_SettingEntry");

            if (DG_IsSettingPage) {
                if (Root) Root.style.display = "none";
                if (Entry) Entry.style.display = "none";  // 设置页不需要再指向自己
                if (Settings) Settings.style.display = "flex";
                DG_InitSettingsPage();
            } else {
                if (Settings) Settings.style.display = "none";
                if (Root) Root.style.display = "";
                if (Entry) Entry.style.display = "";

                // 保留原有参数（比如CODE），只把plug_env改成1
                // 这样带着身份码的链接点过去，设置页也能看到真实的参数情况
                if (Entry) {
                    const Kept = new URLSearchParams(window.location.search);
                    Kept.set("plug_env", "1");
                    Entry.href = "?" + Kept.toString();
                }

                // 应用设置页保存的宽高（保存过才生效，否则保持自适应）
                DG_ApplySizeControl();

                // 应用设置页保存的字号
                DG_ApplyFontSize();

                // 应用面板外观（外框 / 标题）
                DG_ApplyPanelStyle();

                // 启用关闭按钮的委托监听（只需挂一次，之后新加的行自动生效）
                DG_BindCloseDelegation();

                DG_LogProbe("显示页");
            }
        }


        /* ---------------------------------------------------------------------------
         * 【探针】把当前页面的真实环境参数打印出来
         * - 直播姬到底传了什么参数、iframe实际多大，只有实测才知道
         * - 同时输出到控制台和设置页，方便主播直接复制反馈
         * -------------------------------------------------------------------------*/
        function DG_CollectProbe() {
            const Lines = [];
            const W = window.innerWidth;
            const H = window.innerHeight;

            Lines.push("运行模式   : " + (DG_IsSettingPage ? "设置页 (plug_env=1)" : "显示页 (plug_env=0)"));
            Lines.push("plug_env   : " + (DG_UrlParams.get("plug_env") ?? "(未传)"));
            Lines.push("iframe尺寸 : " + W + " × " + H);
            Lines.push("页面地址   : " + window.location.href);
            Lines.push("本地已存宽高: " + JSON.stringify(DG_LoadSize()));
            Lines.push("");

            // 把全部URL参数列出来，这才是我们真正要找的东西
            const All = [...DG_UrlParams];
            if (All.length === 0) {
                Lines.push("URL参数    : (没有任何参数)");
            } else {
                Lines.push("URL参数    : 共 " + All.length + " 个");
                All.forEach(([K, V]) => {
                    // CODE之类的敏感参数不打印全文
                    const Shown = /code|sign|key|token/i.test(K)
                        ? V.slice(0, 3) + "***(已隐藏)"
                        : V;
                    Lines.push("   " + K + " = " + Shown);
                });
            }
            return Lines.join("\n");
        }

        function DG_LogProbe(Tag) {
            console.log("[点怪插件] [" + Tag + "] 环境探针\n" + DG_CollectProbe());
        }

        /**
         * 【摘要】只挑最关键的几行
         * - 直播姬的设置面板可视高度有限，完整探针必须滚动才能看全
         * - 摘要直接给出"有没有CODESIGN"这类结论，不用滚动就能判断
         */
        function DG_CollectProbeSummary() {
            const Get = (K) => DG_UrlParams.get(K);
            const Mark = (Ok) => Ok ? "✅ 有" : "❌ 没有";

            const CodeSign = Get("CODESIGN");
            const Code = Get("CODE");
            const Lines = [];

            Lines.push("运行模式 : " + (DG_IsSettingPage ? "设置页" : "显示页"));
            Lines.push("iframe   : " + window.innerWidth + " × " + window.innerHeight);
            Lines.push("参数个数 : " + [...DG_UrlParams].length);
            Lines.push("");
            Lines.push("CODESIGN : " + Mark(!!CodeSign) + "   ← 决定能否免身份码");
            Lines.push("CODE     : " + Mark(!!Code));
            Lines.push("MID      : " + Mark(!!Get("MID")));
            Lines.push("plug_env : " + (Get("plug_env") ?? "(未传)"));

            // 直接给结论，省得看的人自己推
            Lines.push("");
            if (CodeSign) {
                Lines.push("结论：平台下发了 CODESIGN，");
                Lines.push("      免身份码方案可行。");
                Lines.push("      下一步看它能不能换到长链密钥。");
            } else if (Code) {
                Lines.push("结论：平台下发了 CODE（身份码），");
                Lines.push("      本地自签路线可行，但需解决跨域。");
            } else {
                Lines.push("结论：平台没有下发任何授权凭据。");
                Lines.push("      若确认在直播姬内打开，则说明");
                Lines.push("      插件端拿不到凭据，必须外部代签。");
            }

            return Lines.join("\n");
        }

        /**
         * 刷新探针显示（摘要 + 完整）
         */
        function DG_RefreshProbe() {
            const Sum = document.getElementById("DG_ProbeSummary");
            const Full = document.getElementById("DG_Probe");
            if (Sum) Sum.textContent = DG_CollectProbeSummary();
            if (Full) Full.textContent = DG_CollectProbe();
        }


        /* ---------------------------------------------------------------------------
         * 【设置页】初始化表单
         * -------------------------------------------------------------------------*/
        function DG_InitSettingsPage() {
            const IptW = document.getElementById("DG_W");
            const IptH = document.getElementById("DG_H");
            const IptFont = document.getElementById("DG_Font");
            const BtnSave = document.getElementById("DG_Save");
            const BtnReset = document.getElementById("DG_Reset");
            const Box = document.getElementById("DG_Preview");
            const Wrap = document.getElementById("DG_PreviewWrap");
            const Status = document.getElementById("DG_Status");
            const BtnProbe = document.getElementById("DG_ProbeBtn");

            // 回填当前值
            const Now = DG_LoadSize();
            if (IptW) IptW.value = Now.W;
            if (IptH) IptH.value = Now.H;
            if (IptFont) IptFont.value = DG_LoadFont().Size;

            /**
             * 状态提示
             */
            function SetStatus(Text, IsError) {
                if (!Status) return;
                Status.textContent = Text;
                Status.className = IsError ? "DG_Err" : "";
            }

            /**
             * 显示当前生效值以及它们的来源
             * - 来源很重要：能一眼看出是读了URL参数、本地存储，还是用了默认值
             * - 如果显示“默认值”而你以为存过了，说明localStorage没写进去
             * @param {string} [Extra] 追加一句提示（例如"刷新后生效"）
             */
            function ShowCurrent(Extra) {
                const Cur = DG_LoadSize();
                const Font = DG_LoadFont();
                let Text = "当前生效：" + Cur.W + " × " + Cur.H +
                    "，字号 " + Font.Size + "px";
                if (Extra) Text += "  " + Extra;
                SetStatus(Text, false);
            }

            /**
             * 按输入的宽高重画预览方块
             * - 只做等比缩放，用来直观确认比例对不对
             */
            function Redraw() {
                if (!Box || !Wrap) return;

                const W = DG_ClampSize(IptW && IptW.value, DG_DefaultSize.W);
                const H = DG_ClampSize(IptH && IptH.value, DG_DefaultSize.H);
                const F = DG_ClampFont(IptFont && IptFont.value, DG_Config.FontSize);

                // 留出边框和内边距的余量
                const AvailW = Math.max(20, Wrap.clientWidth - 20);
                const AvailH = Math.max(20, Wrap.clientHeight - 20);

                // 取较小的缩放比例，保证宽高都塞得下
                const Scale = Math.min(AvailW / W, AvailH / H, 1);

                Box.style.width = Math.max(16, Math.round(W * Scale)) + "px";
                Box.style.height = Math.max(16, Math.round(H * Scale)) + "px";

                // 预览里的字也按同样比例缩放，这样能直接看出
                // "这个字号在这么大的面板里能放几行"
                Box.style.fontSize = Math.max(8, Math.round(F * Scale)) + "px";

                Box.textContent = W + " × " + H + " / " + F + "px";
            }

            // 输入时实时预览
            if (IptW) IptW.addEventListener("input", Redraw);
            if (IptH) IptH.addEventListener("input", Redraw);

            // 保存
            if (BtnSave) {
                BtnSave.addEventListener("click", () => {
                    const W = DG_ClampSize(IptW && IptW.value, DG_DefaultSize.W);
                    const H = DG_ClampSize(IptH && IptH.value, DG_DefaultSize.H);
                    const F = DG_ClampFont(IptFont && IptFont.value, DG_Config.FontSize);

                    // 夹紧后把实际生效的值写回输入框，避免显示值与存的值不一致
                    if (IptW) IptW.value = W;
                    if (IptH) IptH.value = H;
                    if (IptFont) IptFont.value = F;

                    // 尺寸和字号都存；只要有一个成功就算成功
                    const OkSize = DG_SaveSize(W, H);
                    const OkFont = DG_SaveFont(F);

                    if (OkSize || OkFont) {
                        ShowCurrent("—— 刷新显示页后生效（插件无法实时改变直播姬的窗口大小）");
                    } else {
                        SetStatus("保存失败：浏览器禁用了本地存储，设置无法持久化", true);
                    }
                    Redraw();
                });
            }

            // 恢复默认
            if (BtnReset) {
                BtnReset.addEventListener("click", () => {
                    DG_ClearSize();
                    DG_ClearFont();
                    if (IptW) IptW.value = DG_DefaultSize.W;
                    if (IptH) IptH.value = DG_DefaultSize.H;
                    if (IptFont) IptFont.value = DG_ClampFont(DG_Config.FontSize, 22);
                    ShowCurrent();
                    Redraw();
                });
            }

            // 字号改动时同步更新预览方块里的字，所见即所得
            if (IptFont) IptFont.addEventListener("input", () => Redraw());

            // 重新检测探针
            if (BtnProbe) {
                BtnProbe.addEventListener("click", () => {
                    DG_RefreshProbe();
                });
            }

            // 复制探针结果：直播姬里不方便选中文字，一键复制最省事
            const BtnCopy = document.getElementById("DG_CopyProbe");
            if (BtnCopy) {
                BtnCopy.addEventListener("click", () => {
                    const Text = DG_CollectProbeSummary() + "\n\n" + DG_CollectProbe();

                    const Done = (Ok) => {
                        BtnCopy.textContent = Ok ? "已复制 ✓" : "复制失败，请手动选中";
                        setTimeout(() => { BtnCopy.textContent = "复制全部结果"; }, 2000);
                    };

                    // 直播姬里剪贴板API不一定可用，准备兜底方案
                    const Fallback = () => {
                        const Ta = document.createElement("textarea");
                        Ta.value = Text;
                        Ta.style.position = "fixed";
                        Ta.style.left = "-9999px";
                        document.body.appendChild(Ta);
                        Ta.select();
                        let Ok = false;
                        try { Ok = document.execCommand("copy"); } catch (E) { }
                        Ta.remove();
                        Done(Ok);
                    };

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(Text)
                            .then(() => Done(true))
                            .catch(Fallback);
                    } else {
                        Fallback();
                    }
                });
            }

            // 首次填充（摘要 + 完整）
            DG_RefreshProbe();

            // “返回显示页”要保留其他参数（比如CODE），但必须去掉plug_env
            // 否则回去还是设置页，等于绕圈
            const Back = document.getElementById("DG_BackLink");
            if (Back) {
                const Kept = new URLSearchParams(window.location.search);
                Kept.delete("plug_env");
                const Qs = Kept.toString();
                Back.href = Qs ? "?" + Qs : window.location.pathname;
            }

            // 面板尺寸变化时重算预览（设置面板会被拉伸）
            if (window.ResizeObserver && Wrap) {
                new ResizeObserver(Redraw).observe(Wrap);
            } else {
                window.addEventListener("resize", Redraw);
            }

            Redraw();
            // 首次进来就把“当前生效值 + 来源”显示出来
            ShowCurrent();
            DG_LogProbe("设置页");
        }


        /* ---------------------------------------------------------------------------
         * 【工具】从文本里判断是否为“点怪”并取出要显示的正文
         * @param   {string} Text 弹幕的 msg 或 SC 的 message
         * @returns {null | {Text:string}} 命中返回对象，未命中返回 null
         * -------------------------------------------------------------------------*/
        function DG_Match(Text) {
            // 防脏数据：null / undefined / 非字符串直接踢掉
            if (typeof Text !== "string") return null;

            const Trimmed = Text.trim();

            // 注意：这里用 trim 后再判断，所以 “  点怪  xxx  ” 也能命中
            if (!Trimmed.startsWith(DG_Config.Prefix)) return null;

            // 正文 = 去掉前缀的部分
            const Body = Trimmed.slice(DG_Config.Prefix.length).trim();

            if (DG_Config.KeepPrefix) {
                // 原文可能是空的，trim后兜底显示前缀，避免出现空白行
                return { Text: Trimmed.length > 0 ? Trimmed : DG_Config.Prefix };
            }

            // 不保留前缀时，正文为空就至少显示个前缀，免得主播不知道是谁点了怪
            return { Text: Body.length > 0 ? Body : DG_Config.Prefix };
        }


        /* ---------------------------------------------------------------------------
         * 【工具】把 1 条文本拆成 多行（可选功能）
         * -------------------------------------------------------------------------*/
        function DG_SplitText(Text) {
            if (!DG_Config.SplitMultiLine) return [Text];

            return Text
                .split(/[;；|｜]/)
                .map(S => S.trim())
                .filter(S => S.length > 0);
        }


        /* ---------------------------------------------------------------------------
         * 【工具】重复消息过滤
         * -------------------------------------------------------------------------*/
        const DG_RecentKeys = new Map(); // Key → 时间戳

        function DG_IsDuplicate(Key) {
            const Now = Date.now();
            const Last = DG_RecentKeys.get(Key);

            // 顺手清理过期记录，防止Map无限长大
            if (DG_RecentKeys.size > 200) {
                DG_RecentKeys.forEach((T, K) => {
                    if (Now - T > DG_Config.DuplicateWindowMs * 10) DG_RecentKeys.delete(K);
                });
            }

            if (Last !== undefined && (Now - Last) < DG_Config.DuplicateWindowMs) return true;

            DG_RecentKeys.set(Key, Now);
            return false;
        }


        /* ---------------------------------------------------------------------------
         * 【工具】删除一行，并把它留下的所有内部记录清理干净
         *
         * 必须一起处理两处，否则会留下悬空引用：
         *   1. DG_Dom.Lines      —— msg_id → 行元素 的登记表（撤回功能靠它找行）
         *   2. DG_DanmakuOrder   —— 普通弹幕的淘汰顺序数组
         *
         * 第2点尤其容易漏：数组里留着已删除的DOM节点，会导致
         * "淘汰最旧一行"时误删一个早就不存在的元素，真正该淘汰的反而留下。
         *
         * @param {HTMLElement} Line 要删除的行
         * @param {boolean} Fade 是否先淡出再删除
         * -------------------------------------------------------------------------*/
        function DG_RemoveLine(Line, Fade) {
            if (!Line) return;

            // 1) 先在登记表里找到并删掉所有指向这一行的条目
            //    这里做全量扫描，而不是只看 Line.dataset.msgId：
            //    早期创建的行可能没有 dataset，靠扫描才清得干净
            DG_Dom.Lines.forEach((El, Key) => {
                if (El === Line) DG_Dom.Lines.delete(Key);
            });

            // 2) 从普通弹幕的顺序数组里摘掉
            const Idx = DG_DanmakuOrder.indexOf(Line);
            if (Idx !== -1) DG_DanmakuOrder.splice(Idx, 1);

            // 3) 从DOM移除
            if (Fade === false) {
                Line.remove();
            } else {
                // 复用SC撤回的淡出动画
                Line.classList.add("DG_Removing");
                setTimeout(() => Line.remove(), 300);
            }
        }


        /* ---------------------------------------------------------------------------
         * 【事件委托】处理关闭按钮的点击
         *
         * 用委托而不是给每个按钮单独 addEventListener：
         * 行是动态增删的，逐行绑事件既麻烦又容易漏掉解绑。
         * 委托只需在容器上挂一次，永远有效。
         * -------------------------------------------------------------------------*/
        function DG_BindCloseDelegation() {
            [DG_Dom.SCZone, DG_Dom.DmZone].forEach((Zone) => {
                if (!Zone) return;

                Zone.addEventListener("click", (Evt) => {
                    // closest 保证点到按钮内部的文字节点也能命中
                    const Btn = Evt.target.closest(".DG_Close");
                    if (!Btn) return;

                    // 按钮的父元素就是这一行
                    const Line = Btn.parentElement;
                    if (!Line) return;

                    // 阻止冒泡：万一以后行本身也要绑定点击行为
                    Evt.preventDefault();
                    Evt.stopPropagation();

                    DG_RemoveLine(Line, true);
                });
            });
        }


        /* ---------------------------------------------------------------------------
         * 【工具】给一行挂上"关闭"按钮
         * - 按钮本身不绑事件，统一由容器上的委托监听处理（见 DG_BindCloseDelegation）
         * - 这样行被删掉时不会留下孤立的事件监听，也不会造成内存泄漏
         * -------------------------------------------------------------------------*/
        function DG_AttachClose(Line) {
            const Btn = document.createElement("span");
            Btn.className = "DG_Close";
            Btn.textContent = "×";
            Btn.title = "删除这一行";
            // 标记一下，方便以后想改成"只允许删SC"之类的策略
            Btn.dataset.dgClose = "1";
            Line.appendChild(Btn);
        }


        /* ---------------------------------------------------------------------------
         * 【核心】生成一行：“用户ID - 文本”
         * @param {object}  Opt
         * @param {string}  Opt.uid    用户UID
         * @param {string}  Opt.uname  用户昵称（显示在行尾）
         * @param {string}  Opt.text   显示文本
         * @param {boolean} Opt.isSC   是否为SC行
         * @param {string}  Opt.msgID  消息ID，用于撤回
         * @returns {HTMLElement} 一行DOM
         * -------------------------------------------------------------------------*/
        function DG_BuildLine(Opt) {
            const Line = document.createElement("div");
            Line.className = "DG_Line" + (Opt.isSC ? " DG_SC" : "");
            // 行左侧竖线是可选的，构建时按当前配置决定
            if (DG_Config.RowLeftBar) Line.classList.add("DG_LeftBar");
            if (Opt.msgID) Line.dataset.msgId = Opt.msgID;
            // 昵称额外存一份到dataset，方便以后做筛选/统计
            Line.dataset.uname = Opt.uname || "";

            // 序号（可选）：只有开启 DG_Config.ShowIndex 时才加
            // 放在最前面，形成"1. 正文"的编号列表观感
            if (DG_Config.ShowIndex && Opt.index !== undefined) {
                const IdxEl = document.createElement("span");
                IdxEl.className = "DG_Index";
                IdxEl.textContent = (Opt.index + 1) + ".";
                Line.appendChild(IdxEl);
            }

            // 正文（可能被拆成多段，这里用 <br> 串起来）
            const TextEl = document.createElement("span");
            TextEl.className = "DG_Text";
            DG_SplitText(Opt.text).forEach((Seg, Idx) => {
                if (Idx > 0) TextEl.appendChild(document.createElement("br"));
                TextEl.appendChild(document.createTextNode(Seg));
            });
            Line.appendChild(TextEl);

            // 昵称部分：开启序号模式时就不显示" - 昵称"了，
            // 因为那种列表形态本来就是纯编号的，人名会显得杂乱
            if (!DG_Config.ShowIndex) {
                // 分隔符
                const SepEl = document.createElement("span");
                SepEl.className = "DG_Sep";
                SepEl.textContent = "-";
                Line.appendChild(SepEl);

                // 用户昵称
                const UserEl = document.createElement("span");
                UserEl.className = "DG_User";
                UserEl.textContent = String(Opt.uname);
                Line.appendChild(UserEl);
            }

            // 行尾的关闭按钮（鼠标悬停时才可见）
            DG_AttachClose(Line);

            return Line;
        }


        /* ---------------------------------------------------------------------------
         * 【工具】登记一行，方便撤回时找到
         * -------------------------------------------------------------------------*/
        function DG_Track(Line, MsgID) {
            if (MsgID) DG_Dom.Lines.set(MsgID, Line);
        }


        /* ---------------------------------------------------------------------------
         * 【普通弹幕】追加到下方列表
         * -------------------------------------------------------------------------*/
        function DG_AddDanmaku(Data) {
            const Hit = DG_Match(Data.msg);
            if (!Hit) return;

            if (DG_IsDuplicate(Data.uid + "|" + Data.msg)) return;

            const Line = DG_BuildLine({
                uid: Data.uid,
                uname: Data.uname,
                text: Hit.Text,
                isSC: false,
                msgID: Data.msg_id,
                // 序号是"到目前为止第几条"，不做重排
                // 因为删中间某行时重排会让其他行的编号跳变，观感更差
                index: DG_TotalDanmaku
            });
            DG_TotalDanmaku += 1;

            DG_Track(Line, Data.msg_id);

            // 普通弹幕永远追加在末尾：从上往下按时间顺序排列
            DG_Dom.DmZone.appendChild(Line);
            DG_DanmakuOrder.push(Line);

            // 超出上限就丢掉最旧的一行
            while (DG_DanmakuOrder.length > DG_Config.MaxDanmaku) {
                const Old = DG_DanmakuOrder.shift();
                // 记得同时从登记表里摘掉，否则Map会一直变大（内存泄漏）
                if (Old && Old.dataset.msgId) DG_Dom.Lines.delete(Old.dataset.msgId);
                if (Old) Old.remove();
            }

            // 出现第一条内容后把提示收起来
            if (DG_Dom.Tip) DG_Dom.Tip.style.display = "none";

            // 这里原本有一句 DG_AutoScroll()，现在已经不需要了：
            // #DG_DmZone 用了 column-reverse，容器天然停在视觉底部，
            // 新行总是可见的，不需要任何JS干预。
        }


        /* ---------------------------------------------------------------------------
         * 【SC】插到顶部最前面（prepend），最新的永远在最上面
         * -------------------------------------------------------------------------*/
        function DG_AddSC(Data) {
            const Hit = DG_Match(Data.message);
            if (!Hit) return;

            if (DG_IsDuplicate(Data.uid + "|" + Data.message)) return;

            const Line = DG_BuildLine({
                uid: Data.uid,
                uname: Data.uname,
                text: Hit.Text,
                isSC: true,
                msgID: Data.msg_id
            });

            DG_Track(Line, Data.msg_id);

            // 关键：prepend，插到最顶上
            DG_Dom.SCZone.prepend(Line);

            // SC区也限个长度，防止越堆越长
            while (DG_Dom.SCZone.childElementCount > DG_Config.MaxSC) {
                const Old = DG_Dom.SCZone.lastElementChild;
                // 同样要摘掉登记表里的记录
                if (Old && Old.dataset.msgId) DG_Dom.Lines.delete(Old.dataset.msgId);
                if (Old) Old.remove();
            }

            if (DG_Dom.Tip) DG_Dom.Tip.style.display = "none";
        }


        /* ---------------------------------------------------------------------------
         * 【SC撤回】按 msg_id / message_id 找到那一行删掉
         * -------------------------------------------------------------------------*/
        function DG_RemoveSC(Data) {
            let Line = null;

            // 优先按 msg_id 找
            if (Data.msg_id && DG_Dom.Lines.has(Data.msg_id)) {
                Line = DG_Dom.Lines.get(Data.msg_id);
                DG_Dom.Lines.delete(Data.msg_id);
            }

            // 找不到就退而求其次，用 message_id 全量扫一遍
            if (!Line && Data.message_id !== undefined) {
                const Wanted = String(Data.message_id);
                DG_Dom.Lines.forEach((El, Key) => {
                    if (Line) return;
                    // 之前登记时用的可能是 msg_id，所以这里顺便比对 dataset
                    if (String(El.dataset.msgId) === Wanted ||
                        El.dataset.messageId === Wanted) {
                        Line = El;
                        DG_Dom.Lines.delete(Key);
                    }
                });
            }

            if (!Line) return;

            // 复用统一的删除逻辑：淡出 + 清理登记表 + 清理顺序数组
            DG_RemoveLine(Line, true);
        }


        /* ---------------------------------------------------------------------------
         * 【已废弃】自动滚动
         * - 原本用来保证"最新一条可见"
         * - 现在 #DG_DmZone 用 column-reverse + overflow:hidden 实现同一目的，
         *   而且是从CSS层面天然成立的，比JS滚动更可靠（不闪烁、不依赖帧时序）
         * - 保留这个空函数只是为了说明演进过程，可以直接删掉
         * -------------------------------------------------------------------------*/
        // function DG_AutoScroll() { ... }


        /* ============================================================================
         *  【本地桥接】从本地弹幕服务取数据
         *
         *  背景：浏览器受 CORS 限制，调不了 live-open.biliapi.com；
         *        插件里也不能放开发者密钥。
         *        所以由"本地程序.js"在浏览器之外完成签名+连长链，
         *        再通过 localhost 的 WebSocket 把弹幕转发进来。
         *
         *  好处：主播不需要注册开发者账号、不需要插件上架，
         *        只要双击运行本地程序即可。
         *
         *  回退：本地服务没开时，自动退回 SDK 直连（平台上架通道 / 本地自签调试）
         * ==========================================================================*/
        const DG_Bridge = {
            Socket: null,
            State: "idle",        // idle | connecting | connected | closed
            RetryTimer: null,
            GiveUpMs: 4000,       // 连不上就放弃，让SDK接手
            SdkStarted: false,
        };

        /**
         * 启动本地桥接
         * @param {boolean} AllowFallback 连不上时是否让SDK接手
         */
        function DG_StartBridge(AllowFallback) {
            if (!DG_Config.UseLocalBridge) {
                if (AllowFallback) DG_StartSdk();
                return;
            }

            DG_Bridge.State = "connecting";

            let Socket;
            try {
                Socket = new WebSocket(DG_Config.LocalBridgeUrl);
            } catch (E) {
                console.log("[点怪插件] 本地服务地址不合法，改用SDK直连");
                if (AllowFallback) DG_StartSdk();
                return;
            }
            DG_Bridge.Socket = Socket;

            // 连不上的兜底：等一小会儿还没连上，就认为本地服务没开
            const FallbackTimer = setTimeout(() => {
                if (DG_Bridge.State === "connecting") {
                    console.log("[点怪插件] 本地服务未响应，改用SDK直连");
                    try { Socket.close(); } catch (E) { }
                    DG_Bridge.State = "closed";
                    if (AllowFallback) DG_StartSdk();
                }
            }, DG_Bridge.GiveUpMs);

            Socket.addEventListener("open", () => {
                clearTimeout(FallbackTimer);
                DG_Bridge.State = "connected";
                console.log("[点怪插件] 已连上本地弹幕服务，开始接收弹幕");
                DG_SetTip("已连接本地服务，等待“点怪”弹幕…");
                // 连上后不再重试，交给正常流程
                DG_Bridge.RetryTimer = null;
            });

            Socket.addEventListener("message", (Evt) => {
                let Msg = null;
                try { Msg = JSON.parse(Evt.data); } catch (E) { return; }
                DG_HandleBridgeMsg(Msg);
            });

            Socket.addEventListener("close", () => {
                clearTimeout(FallbackTimer);
                const WasConnected = DG_Bridge.State === "connected";
                DG_Bridge.State = "closed";

                if (WasConnected) {
                    console.warn("[点怪插件] 本地服务断开，正在重连…");
                    DG_SetTip("与本地服务的连接已断开，正在重连…");
                }
                // 无论之前是否连上，都持续重试（主播可能中途才启动本地程序）
                DG_ScheduleBridgeRetry(AllowFallback);
            });

            Socket.addEventListener("error", () => {
                // 具体错误交给 close 处理，这里不重复报
            });
        }

        /**
         * 断开后定时重试
         */
        function DG_ScheduleBridgeRetry(AllowFallback) {
            if (DG_Bridge.RetryTimer) return;
            DG_Bridge.RetryTimer = setTimeout(() => {
                DG_Bridge.RetryTimer = null;
                if (DG_Bridge.State === "closed") {
                    console.log("[点怪插件] 重试连接本地服务…");
                    // 重试阶段不再回退SDK（已经在跑或已经放弃过了）
                    DG_StartBridge(false);
                }
            }, DG_Config.LocalBridgeRetryMs);
        }

        /**
         * 处理本地服务转发来的消息
         * - 结构由 本地程序.js 决定：
         *     {type:"status", state:"connected"|"disconnected"}
         *     {type:"event",  cmd:"LIVE_OPEN_PLATFORM_XXX", data:{...}}
         */
        function DG_HandleBridgeMsg(Msg) {
            if (!Msg || !Msg.type) return;

            if (Msg.type === "status") {
                if (Msg.state === "connected") {
                    DG_SetTip("已连接直播间，等待“点怪”弹幕…");
                }
                return;
            }

            if (Msg.type !== "event") return;

            // 复用 SDK 的事件分发逻辑：
            // 把转发来的事件重新组装成 SDK 期望的格式，
            // 交给 NewJSONMsg 处理 —— 这样过滤规则只有一份，
            // 不会出现"本地模式和SDK模式行为不一致"
            if (Msg.cmd === "LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL") {
                // SC撤回也走同一条路：SDK里这个分支会调 DelSC
                BiLive_PlayWithMeJS_WEBSocketClient.NewJSONMsg({
                    cmd: Msg.cmd,
                    data: Msg.data,
                });
                return;
            }

            BiLive_PlayWithMeJS_WEBSocketClient.NewJSONMsg({
                cmd: Msg.cmd,
                data: Msg.data,
            });
        }

        /**
         * 设置底部提示文字
         */
        function DG_SetTip(Text) {
            const Tip = document.getElementById("DG_Tip");
            if (!Tip) return;
            // 已经出过弹幕就不再显示提示，避免盖住内容
            if (Tip.style.display === "none") return;
            Tip.textContent = Text;
        }

        /**
         * 启动 SDK 直连（平台上架通道，或本地自签调试）
         */
        function DG_StartSdk() {
            if (DG_Bridge.SdkStarted) return;
            DG_Bridge.SdkStarted = true;
            console.log("[点怪插件] 通过 SDK 启动");
            // ===== STANDARD_CODESIGN_PATCH（由 生成index.js 自动插入，勿手改）=====
        // 说明：BiLive_PlayWithMeJS.Init() 的原逻辑是
        //   "URL里没有 CODE 参数 → 弹出身份码索要窗"
        // 但平台上架后，平台下发的是 CODESIGN 而不是 CODE，
        // 于是主播打开插件会莫名被索要身份码。
        // 这里包一层：只要检测到 CODESIGN，就跳过弹窗，直接走 AppStart。
        // 本补丁只存在于生产副本(由 生成index.js 插入)，源文件一个字都没改，
        // 所以本地调试时该弹窗还是照常弹，方便你手动填身份码。
        (function () {
            const OrigInit = BiLive_PlayWithMeJS.Init;

            BiLive_PlayWithMeJS.Init = function () {
                // 不带 hook 的原调用：让它解析URL参数、填充 Paramaters
                OrigInit.apply(this, arguments);

                const HasCodeSign = BiLive_PlayWithMeJS.Paramaters.has("CODESIGN");
                const HasCode = BiLive_PlayWithMeJS.Paramaters.has("CODE");

                if (HasCodeSign && !HasCode) {
                    // 关掉SDK误弹的索码窗
                    if (typeof BiLive_PlayWithMeJS_AuthDialog !== "undefined") {
                        try { BiLive_PlayWithMeJS_AuthDialog.Hide(); } catch (E) { }
                    }
                    console.log("[点怪插件] 检测到平台下发的 CODESIGN，跳过身份码窗，直接申请启动");
                    BiLive_PlayWithMeJS.AppStart();
                }
            };
        })();

        BiLive_PlayWithMeJS.Init();
        }


        /* ============================================================================
         *  【事件绑定区】开始对接 PlayWithMe.js
         *
         *  整段只在“显示页”执行。
         *  设置页不绑定任何事件、也不连开平长链——否则主播一打开设置面板，
         *  就会被SDK的“请提供您的主播身份码”弹窗糊一脸。
         * ==========================================================================*/
        if (!DG_IsSettingPage) {

        // 新弹幕
        BiLive_PlayWithMeJS.NewDanmaku = (Data) => {
            // Data 就是 OpenLive 的 data 对象，字段：msg / uid / uname / uface / msg_id ...
            DG_AddDanmaku(Data);
        };

        // 新SC
        BiLive_PlayWithMeJS.NewSC = (Data) => {
            // 注意SC的正文在 Data.message，不是 Data.msg
            DG_AddSC(Data);
        };

        // SC撤回
        BiLive_PlayWithMeJS.DelSC = (Data) => {
            DG_RemoveSC(Data);
        };

        // 开平长链连接成功
        BiLive_PlayWithMeJS.AppStarted = (Data) => {
            console.log("[点怪插件] 开平长链已建立，开始监听直播间：" + Data.data.anchor_info.room_id);
            if (DG_Dom.Tip) {
                DG_Dom.Tip.textContent = "已连接到直播间 " + Data.data.anchor_info.room_id + "，等待“点怪”弹幕…";
            }
        };

        // 掉线提示
        BiLive_PlayWithMeJS.WSClientDisconnect = (Evt) => {
            console.warn("[点怪插件] 开平长链掉线", Evt);
            if (DG_Dom.Tip) {
                DG_Dom.Tip.style.display = "";
                DG_Dom.Tip.textContent = "开平长链已掉线，请刷新页面重连";
            }
        };


        /* ---------------------------------------------------------------------------
         * 【补丁】修复SDK里 SC撤回 事件的BUG
         *
         * BiLive_PlayWithMe.js 收到 LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL 时调用的是
         *   BiLive_PlayWithMeJS.SCDel(Msg.data)
         * 但SDK对外声明、Demo里用的都是
         *   BiLive_PlayWithMeJS.DelSC
         * 结果就是 SCDel 不存在 → 抛异常 → 撤回事件根本不会触发。
         *
         * 这里给它别名指向我们绑好的 DelSC，属于外部补丁，不动SDK源码。
         * 如果你已经把SDK第599行改成了 DelSC，那这段可以直接删掉。
         * -------------------------------------------------------------------------*/
        BiLive_PlayWithMeJS.SCDel = (Data) => BiLive_PlayWithMeJS.DelSC(Data);

        } // ← 显示页专用事件绑定区结束


        /* ============================================================================
         *  【可选】本地模拟测试
         *  不想开播就想看效果时，在控制台执行：
         *      DG_Test()
         *  或喂真实数据：
         *      BiLive_PlayWithMeJS.Test({ "cmd":"LIVE_OPEN_PLATFORM_DM", "data":{ ... } })
         * ==========================================================================*/
        window.DG_Test = function () {
            // 两条普通弹幕
            BiLive_PlayWithMeJS.Test({
                "cmd": "LIVE_OPEN_PLATFORM_DM",
                "data": {
                    "uid": 10086, "uname": "测试用户A", "msg": "点怪 我点了个大怪",
                    "msg_id": "test-dm-1", "timestamp": 1650717881
                }
            });
            BiLive_PlayWithMeJS.Test({
                "cmd": "LIVE_OPEN_PLATFORM_DM",
                "data": {
                    "uid": 10087, "uname": "测试用户B", "msg": "这条不该显示",
                    "msg_id": "test-dm-2", "timestamp": 1650717882
                }
            });

            // 一条SC
            BiLive_PlayWithMeJS.Test({
                "cmd": "LIVE_OPEN_PLATFORM_SUPER_CHAT",
                "data": {
                    "uid": 1270482, "uname": "测试金主", "message": "点怪 我出30块点这只",
                    "message_id": 3992851, "msg_id": "test-sc-1", "rmb": 30,
                    "timestamp": 1652413567
                }
            });

            // 3秒后撤回刚才那条SC
            setTimeout(() => {
                BiLive_PlayWithMeJS.Test({
                    "cmd": "LIVE_OPEN_PLATFORM_SUPER_CHAT_DEL",
                    "data": { "message_id": 3992851, "msg_id": "test-sc-1", "uid": 1270482 }
                });
            }, 3000);

            console.log("[点怪插件] 模拟数据已注入：2条弹幕 + 1条SC（3秒后撤回）");
        };


        /* ============================================================================
         *  【必填】插件配置
         *  这一段设置页也要执行：AppID 与签名器是SDK的静态字段，
         *  设置页里赋值不会有任何副作用（只要不调 Init 就不会发起请求）。
         * ==========================================================================*/

        // 开放平台应用ID，见 https://open-live.bilibili.com/open-manage 插件详情页
        BiLive_PlayWithMeJS.AppID = 1792520717598;

        // 本地自签（开发者Key），来自 MyOpenLiveKey.js
        // - 只在“本地自签”这条路上才用得到，线上代签完全不需要
        // - MyOpenLiveKey.js 可能不存在（线上发布时应该删掉），所以必须判存在再取，
        //   否则会抛 MyOpenLiveKey is not defined，把整个脚本打断
        if (typeof MyOpenLiveKey !== "undefined") {
            BiLive_PlayWithMeJS_Authorizer.BiliOpenLiveAccessKey = MyOpenLiveKey.AccessKey;
            BiLive_PlayWithMeJS_Authorizer.BiliOpenLiveSecretKey = MyOpenLiveKey.SecretKey;
        } else {
            console.log("[点怪插件] 未检测到 MyOpenLiveKey.js，本地自签不可用（线上代签不受影响）");
        }

        // 第三方代签（二选一，填了就会覆盖上面的本地自签，也不会再弹身份码窗）
        // 这是给主播正式使用时唯一可行的路：
        //   ① 同源代签：填你自己域名下的接口，需要后端配合
        //   ② JSONP代签：跨域也能用，只需一个能返回JS的接口
        // BiLive_PlayWithMeJS_Authorizer.SameOriginAuthorizerServer = "https://你的域名/api/authorize";
        // BiLive_PlayWithMeJS_Authorizer.JSONPAuthorizerServer = "https://你的域名/api/authorize_jsonp";
        BiLive_PlayWithMeJS_Authorizer.SameOriginAuthorizerServer = "";
        BiLive_PlayWithMeJS_Authorizer.JSONPAuthorizerServer = "";

        // 主播身份码不要写死！给主播用网址参数传：
        //   点怪弹幕插件.html?CODE=BNB1RBFZQ96O4
        // 没传的话SDK会自动弹窗索要身份码。

        // 最后一步：启动
        // 只有显示页才真正取数据；设置页到此为止
        if (!DG_IsSettingPage) {
            // 先尝试本地弹幕服务（主播模式：不需要上架、不需要开发者账号）
            // 连不上会自动回退到 SDK 直连（平台上架通道 / 本地自签调试）
            DG_StartBridge(true);
        } else {
            console.log("[点怪插件] 当前为设置页 (plug_env=1)，不启动开平长链");
        }

        // 按运行模式切换界面
        // 放在脚本最后执行：此时设置页与显示区的DOM都已经解析完毕
        DG_ApplyPageMode();
    </script>

</body>
